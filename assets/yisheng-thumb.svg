<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变：深色 + 暖橙 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e08"/>
      <stop offset="50%" style="stop-color:#2a1408"/>
      <stop offset="100%" style="stop-color:#0f0a08"/>
    </linearGradient>

    <!-- 暖橙主调（呼应主站 #ff8c42） -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.6"/>
    </linearGradient>

    <!-- 金色高亮 -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </linearGradient>

    <!-- 朱红封印 -->
    <linearGradient id="sealRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8161d"/>
      <stop offset="100%" style="stop-color:#a01015"/>
    </linearGradient>

    <!-- 发光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 网格 -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,140,66,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- 角落装饰 -->
  <path d="M 60 60 L 60 100 M 60 60 L 100 60" stroke="#ff8c42" stroke-width="2" fill="none"/>
  <path d="M 1140 60 L 1140 100 M 1140 60 L 1100 60" stroke="#ff8c42" stroke-width="2" fill="none"/>
  <path d="M 60 740 L 60 700 M 60 740 L 100 740" stroke="#ff8c42" stroke-width="2" fill="none"/>
  <path d="M 1140 740 L 1140 700 M 1140 740 L 1100 740" stroke="#ff8c42" stroke-width="2" fill="none"/>

  <!-- 中央六爻卦象（64 卦之一 — 需卦，水火既济） -->
  <g transform="translate(600, 380)" filter="url(#glow)">
    <!-- 卦外圈 -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="rgba(255,140,66,0.15)" stroke-width="1"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(255,140,66,0.2)" stroke-width="1"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="rgba(255,140,66,0.08)" stroke-width="1" stroke-dasharray="6 8"/>

    <!-- 八卦方位刻度 -->
    <g stroke="rgba(255,215,0,0.4)" stroke-width="1.5">
      <line x1="0" y1="-220" x2="0" y2="-200"/>
      <line x1="220" y1="0" x2="200" y2="0"/>
      <line x1="0" y1="220" x2="0" y2="200"/>
      <line x1="-220" y1="0" x2="-200" y2="0"/>
      <line x1="155" y1="-155" x2="141" y2="-141"/>
      <line x1="155" y1="155" x2="141" y2="141"/>
      <line x1="-155" y1="155" x2="-141" y2="141"/>
      <line x1="-155" y1="-155" x2="-141" y2="-141"/>
    </g>

    <!-- 卦象（水火既济 ☵☲）六爻，从下往上 -->
    <g transform="translate(-80, -100)">
      <!-- 第一爻 阳 (初九) -->
      <rect x="0" y="0" width="160" height="14" rx="2" fill="url(#orangeGradient)"/>
      <!-- 第二爻 阴 (六二) -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="72" height="14" rx="2" fill="url(#orangeGradient)"/>
        <rect x="88" y="0" width="72" height="14" rx="2" fill="url(#orangeGradient)"/>
      </g>
      <!-- 第三爻 阳 (九三) -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="160" height="14" rx="2" fill="url(#orangeGradient)"/>
      </g>
      <!-- 第四爻 阴 (九四 — 应位，高亮) -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="72" height="14" rx="2" fill="#ffd700"/>
        <rect x="88" y="0" width="72" height="14" rx="2" fill="#ffd700"/>
      </g>
      <!-- 第五爻 阳 (九五 — 君位，最高亮) -->
      <g transform="translate(0, 128)">
        <rect x="0" y="0" width="160" height="14" rx="2" fill="#ffd700"/>
      </g>
      <!-- 第六爻 阴 (上六) -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="72" height="14" rx="2" fill="url(#orangeGradient)"/>
        <rect x="88" y="0" width="72" height="14" rx="2" fill="url(#orangeGradient)"/>
      </g>
    </g>

    <!-- 中央印章 -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="36" fill="url(#sealRed)" opacity="0.95"/>
      <text x="0" y="9" text-anchor="middle" font-family="serif" font-size="32" font-weight="900" fill="#fdf0d5">爻</text>
    </g>
  </g>

  <!-- 左侧统计曲线（Elo + DC 暗示） -->
  <g opacity="0.5">
    <path d="M 100 600 Q 200 580 280 590 T 380 560 T 440 580" stroke="#ff8c42" stroke-width="1.5" fill="none"/>
    <path d="M 100 640 Q 200 620 280 630 T 380 600 T 440 620" stroke="#ffd700" stroke-width="1.5" fill="none"/>
  </g>

  <!-- 右侧统计曲线 -->
  <g opacity="0.5">
    <path d="M 760 600 Q 840 580 920 590 T 1020 560 T 1100 580" stroke="#ff8c42" stroke-width="1.5" fill="none"/>
    <path d="M 760 640 Q 840 620 920 630 T 1020 600 T 1100 620" stroke="#ffd700" stroke-width="1.5" fill="none"/>
  </g>

  <!-- 顶部标签 -->
  <g transform="translate(600, 80)">
    <rect x="-90" y="-22" width="180" height="44" rx="22" fill="rgba(255,140,66,0.15)" stroke="rgba(255,140,66,0.4)" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ff8c42" letter-spacing="2">易学 × 统计</text>
  </g>

  <!-- 主标题 -->
  <text x="600" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    爻胜 <tspan fill="url(#orangeGradient)">YiSheng</tspan>
  </text>

  <!-- 副标题 -->
  <text x="600" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.6)" letter-spacing="3">
    ELO + DIXON-COLES · 六爻 · 梅花易数 · 大六壬
  </text>

  <!-- 底部数据条 -->
  <g transform="translate(600, 720)">
    <!-- 左 -->
    <g transform="translate(-280, 0)">
      <text x="0" y="0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">913</text>
      <text x="0" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="0.5">场国际赛校准</text>
    </g>
    <!-- 中左 -->
    <g transform="translate(-95, 0)">
      <text x="0" y="0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,140,66,0.8)" letter-spacing="1">93/80/93/94</text>
      <text x="0" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="0.5">测试覆盖率</text>
    </g>
    <!-- 中右 -->
    <g transform="translate(95, 0)">
      <text x="0" y="0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,215,0,0.8)" letter-spacing="1">70+30%</text>
      <text x="0" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="0.5">融合权重</text>
    </g>
    <!-- 右 -->
    <g transform="translate(280, 0)">
      <text x="0" y="0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">Rust + Node</text>
      <text x="0" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="0.5">双端架构</text>
    </g>
  </g>
</svg>