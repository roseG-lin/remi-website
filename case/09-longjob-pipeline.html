<script>
'use strict';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgUse(id, size) { return '<svg class="icon" width="' + (size || 20) + '" height="' + (size || 20) + '"><use href="#' + id + '"/></svg>'; }


function toast(){}
const DEMOS = {
  'longjob-pipeline': {
    mount(stage) {
      stage.innerHTML =
        '<div class="demo-card" style="margin-bottom:20px"><div class="t">输入 · 真实 JD（公司在册，名称脱敏）</div>' +
          '<p style="font-size:var(--text-sm);line-height:1.8" class="muted">某 AI 科技公司 · AI 业务解决方案顾问（FDE）· 深圳 · 15-30K × 13薪 · 3-5 年。<br>客户业务场景拆解，输出可演示 AI 方案。要求 RAG / Agent 实战，ToB 汇报经验，电商语境加分。</p>' +
          '<button class="btn btn-primary" data-run style="margin-top:16px">运行 L0 → L2</button>' +
        '</div>' +
        '<div class="rag-pipe" style="max-width:none">' +
          '<div class="rag-node"><span class="st">L0</span><div class="bd"><div class="t">JD 解析</div><div class="d">提取能力词 + 硬门槛 + 隐性信号</div></div><span class="n"></span></div>' +
          '<div data-o0></div>' +
          '<div class="rag-node"><span class="st">L1</span><div class="bd"><div class="t">命中映射</div><div class="d">能力词 × J0 画像 × J1 矩阵 → 逐条评级</div></div><span class="n"></span></div>' +
          '<div data-o1></div>' +
          '<div class="rag-node"><span class="st">L2</span><div class="bd"><div class="t">简历定制</div><div class="d">量化句动词开头 · guardrails 三查</div></div><span class="n"></span></div>' +
          '<div data-o2></div>' +
        '</div>' +
        '<div class="demo-note">真实链路产物 9 个文件在册（托举/云阁-AISolFDE-20260905）· 40 个纯标准库工具 · 368 测试（longjob 仓，全仓回归见页首）</div>';
      $('[data-run]', stage).addEventListener('click', ev => {
        ev.target.disabled = true;
        const nodes = $$('.rag-node', stage);
        const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 60 : ms));
        const done = (n, txt) => { nodes[n].classList.remove('run'); nodes[n].classList.add('done'); nodes[n].querySelector('.st').textContent = '✓'; nodes[n].querySelector('.n').textContent = txt; };
        (async () => {
          nodes[0].classList.add('run');
          await wait(500);
          done(0, '6 个能力词');
          $('[data-o0]', stage).innerHTML = '<div class="chips" style="margin:4px 0 12px 44px"><span class="chip">业务场景拆解</span><span class="chip">可演示方案</span><span class="chip">RAG 实战</span><span class="chip">Agent 实战</span><span class="chip">ToB 汇报</span><span class="chip">电商语境</span></div>';
          nodes[1].classList.add('run');
          await wait(650);
          done(1, '11 ✅ · 2 🟡 · 1 ✗');
          $('[data-o1]', stage).innerHTML =
            '<div style="margin:4px 0 12px 44px;font-size:var(--text-sm);line-height:2">' +
            '<div><span class="verdict ok">✅ 强</span> 业务场景拆解 ← 90 万项目全链</div>' +
            '<div><span class="verdict ok">✅ 强</span> ToB 汇报 ← 80+ 场项目汇报</div>' +
            '<div><span class="verdict ok">✅ 强</span> Agent 实战 ← 玲珑矩阵 15 款产品</div>' +
            '<div><span class="verdict ok">✅ 命中</span> RAG 实战 ← 1529 向量点实测</div>' +
            '<div><span class="verdict warn">🟡 中</span> 可演示方案 ← Demo 在，补包装话术</div>' +
            '<div><span class="verdict bad">✗ 缺</span> 电商语境 ← 不编造，L4 开条电商 Demo 产线补语境</div></div>';
          nodes[2].classList.add('run');
          await wait(650);
          done(2, '三查全过');
          $('[data-o2]', stage).innerHTML =
            '<div class="rag-result on" style="margin:4px 0 12px 44px"><b>简历 bullet：</b>主导 <b>90 万级</b>指挥大厅项目：需求访谈 → 场景拆解 → 方案汇报 → 验收答辩全链。' +
            '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><span class="verdict ok">✓ 红线查</span><span class="verdict ok">✓ 不编造查</span><span class="verdict ok">✓ 防堆砌查</span></div></div>';
        })();
      });
    },
  },
};
const stage = document.getElementById('stage');
const run = () => { stage.innerHTML = ''; try { DEMOS['longjob-pipeline'].mount(stage); } catch (e) { stage.innerHTML = '<p class="muted mono">Demo 未响应，请刷新重试。</p>'; } };
document.getElementById('resetBtn').addEventListener('click', run);
run();
/* 进度条 + aurora 静态降级 */
addEventListener('scroll', () => { const p = document.getElementById('progress'); const d = document.documentElement; p.style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%'; }, { passive: true });
</script>
