<script>
'use strict';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgUse(id, size) { return '<svg class="icon" width="' + (size || 20) + '" height="' + (size || 20) + '"><use href="#' + id + '"/></svg>'; }


const DEMOS = {
  'reyes-video': {
    mount(stage) {
      stage.innerHTML =
        '<div class="chips" style="margin-bottom:14px" data-tabs><span class="chip on" data-t="0">① 流水线演练 · 讲稿进成片出</span><span class="chip" data-t="1">② 时间轴对齐 · 真实系数</span><span class="chip" data-t="2">③ 产线版本 · v6 到 v8</span></div>' +
        '<div data-pane="0"></div><div data-pane="1" style="display:none"></div><div data-pane="2" style="display:none"></div>';
      const panes = $$('[data-pane]', stage);
      $$('[data-tabs] .chip', stage).forEach(c => c.addEventListener('click', () => {
        $$('[data-tabs] .chip', stage).forEach(x => x.classList.remove('on'));
        c.classList.add('on'); panes.forEach(p => p.style.display = 'none'); panes[+c.dataset.t].style.display = '';
      }));

      /* ① 流水线 */
      const p0 = panes[0];
      p0.innerHTML =
        '<div class="demo-card"><div class="t">输入讲稿（可改）</div>' +
          '<textarea data-src style="width:100%;min-height:60px;margin-top:8px;border:var(--hairline) solid hsl(var(--border));border-radius:var(--radius-md);background:hsl(var(--surface-2));color:hsl(var(--foreground));padding:10px;font-size:var(--text-xs);line-height:1.7;resize:vertical">注意力机制的核心：让每个字都学会看全局。Query 去问，Key 去答，Value 把答案带回来。</textarea>' +
          '<button type="button" class="action mt-2" data-run aria-controls="log-04"><span>▶ 跑一遍产线</span><span class="action-go" aria-hidden="true">运行</span></button></div>' +
        '<div class="demo-card"><div class="t">五站流水线</div><div class="demo-log" id="log-04" data-line></div></div>';
      const STAGES = [
        ['讲稿解析', s => '12 句讲稿 → 7 个镜头单元 · 3 个强调点'],
        ['白板标注', s => 'annotation.json 生成 · ' + (18 + (s.length % 9)) + ' 个书写/圈画动作'],
        ['画面渲染', s => 'SSE 逐帧揭示 · 静态底图 + 动作序列'],
        ['TTS 配音', s => '语音合成完成 · 实测时长 166.5s'],
        ['字幕合成', s => 'SRT 时间轴缩放 ×0.648 对齐 → ffmpeg 合成'],
      ];
      $('[data-run]', p0).addEventListener('click', () => {
        const src = $('[data-src]', p0).value, line = $('[data-line]', p0);
        const btn = $('[data-run]', p0);
        const label = btn.firstElementChild.textContent;
        btn.disabled = true; btn.setAttribute('aria-busy', 'true');
        btn.firstElementChild.textContent = '运行中…';
        line.innerHTML = ''; let i = 0;
        (function tick() {
          if (i >= STAGES.length) {
            line.innerHTML += '<div class="ok-text">✓ 成片就绪，mp4 可用；P0 第 1 课即这条产线的实测成品</div>';
            btn.disabled = false; btn.removeAttribute('aria-busy');
            btn.firstElementChild.textContent = label;
            return;
          }
          const st = STAGES[i];
          line.innerHTML += '<div><span style="color:hsl(var(--accent))">[' + (i + 1) + '/5 ' + st[0] + ']</span> ' + st[1](src) + '</div>';
          i++; setTimeout(tick, 420);
        })();
      });

      /* ② 时间轴对齐 */
      const p1 = panes[1];
      p1.innerHTML =
        '<div class="demo-card"><div class="t">问题：TTS 实际 166.5s，字幕脚本预估 257s——不齐</div>' +
          '<div style="margin-top:12px;font-size:var(--text-xs)" class="muted">字幕轨（预估）</div>' +
          '<div data-bar1 style="height:26px;border-radius:var(--radius-md);background:hsl(var(--surface-2));border:var(--hairline) solid hsl(var(--border));position:relative;overflow:hidden"><div style="position:absolute;inset:0;width:100%;background:hsl(var(--accent)/.55);transition:width 1s cubic-bezier(.16,1,.3,1)"></div><span class="mono" style="position:absolute;right:8px;top:4px;font-size:var(--text-xs)">257s</span></div>' +
          '<div style="margin-top:10px;font-size:var(--text-xs)" class="muted">配音轨（实测）</div>' +
          '<div style="height:26px;border-radius:var(--radius-md);background:hsl(var(--accent)/.55)"><span class="mono" style="float:right;margin:4px 8px;font-size:var(--text-xs)">166.5s</span></div>' +
          '<button class="chip acc" data-align style="margin-top:12px;width:100%;justify-content:center">▶ 应用缩放系数 ×0.648</button></div>' +
        '<div class="demo-card"><div class="t">对齐后</div>' +
          '<div data-after style="margin-top:12px;font-size:var(--text-xs);line-height:2">每条字幕的 startMs / durationMs 按实测时长等比缩放——字幕贴着声音走，不漂移。<br><span class="muted" style="font-size:var(--text-xs)">真实案例数字：P0 第 1 课白板课，TTS 166.5s vs SRT 预估 257s → ×0.648</span></div></div>';
      $('[data-align]', p1).addEventListener('click', () => {
        const b = $('[data-bar1] div', p1); if (b) b.style.width = '64.8%';
      });

      /* ③ 版本 */
      const p2 = panes[2];
      p2.innerHTML =
        '<div class="demo-card"><div class="t">产线不是一次成型的</div>' +
          '<div class="tl" style="margin-top:12px">' +
          '<div class="tl-item"><div class="tl-ver">v6</div><div class="tl-title">白板课产线 v1</div><div class="tl-desc">标注驱动渲染跑通：annotation.json → 逐帧揭示 → ffmpeg 合成</div></div>' +
          '<div class="tl-item"><div class="tl-ver">v7</div><div class="tl-title">样片四修</div><div class="tl-desc">卡镜头改生图素材、字幕下置用原稿、过程句不走素材站、实拍 30fps 不断流</div></div>' +
          '<div class="tl-item now"><div class="tl-ver">v8</div><div class="tl-title">产线固化 · 回归锁定</div><div class="tl-desc">管线参数化 + 回归测试锁定——视频生产从手艺变成产线</div></div>' +
          '</div></div>' +
        '<div class="demo-card"><div class="t">为什么值得看</div>' +
          '<div style="margin-top:12px;font-size:var(--text-xs);line-height:2">讲解视频是内容生产里最费时的形态。之眼把它拆成可测试的五个阶段，每一站都是确定性代码——「LLM 写语义、代码干精细活」的完整示范。</div></div>';
    },
  },
};
const stage = document.getElementById('stage');
const run = () => { stage.innerHTML = ''; try { DEMOS['reyes-video'].mount(stage); } catch (e) { stage.innerHTML = '<p class="muted mono">Demo 未响应，请刷新重试。</p>'; } };
document.getElementById('resetBtn').addEventListener('click', run);
run();
addEventListener('scroll', () => { const p = document.getElementById('progress'); const d = document.documentElement; p.style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%'; }, { passive: true });
</script>
