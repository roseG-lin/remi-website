<script>
'use strict';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgUse(id, size) { return '<svg class="icon" width="' + (size || 20) + '" height="' + (size || 20) + '"><use href="#' + id + '"/></svg>'; }


const DEMOS = {
  'yisheng-engine': {
    mount(stage) {
      stage.innerHTML =
        '<div class="chips" style="margin-bottom:14px" data-tabs><span class="chip on" data-t="0">① 对阵预测 · 真 Elo 实算</span><span class="chip" data-t="1">② 滚动回测 · 对基线</span><span class="chip" data-t="2">③ 融合决策 · 权重与冲突</span></div>' +
        '<div data-pane="0"></div><div data-pane="1" style="display:none"></div><div data-pane="2" style="display:none"></div>';
      const panes = $$('[data-pane]', stage);
      $$('[data-tabs] .chip', stage).forEach(c => c.addEventListener('click', () => {
        $$('[data-tabs] .chip', stage).forEach(x => x.classList.remove('on'));
        c.classList.add('on'); panes.forEach(p => p.style.display = 'none'); panes[+c.dataset.t].style.display = '';
      }));

      /* ① 真 Elo 对阵 */
      const ELO = { '西班牙': 2075, '法国': 2034, '阿根廷': 2064, '巴西': 1999, '英格兰': 1990, '葡萄牙': 1942, '荷兰': 1939, '德国': 1937, '意大利': 1915, '摩洛哥': 1877, '克罗地亚': 1869, '日本': 1852, '墨西哥': 1847, '美国': 1798 };
      const opts = Object.keys(ELO).map(k => '<option>' + k + '</option>').join('');
      const p0 = panes[0];
      p0.innerHTML =
        '<div class="demo-grid">' +
          '<div class="demo-card"><div class="t">选对阵（真实 Elo 校准口径）</div>' +
            '<div style="display:flex;gap:8px;margin-top:10px;align-items:center">' +
            '<select data-ha style="flex:1;background:hsl(var(--surface-2));border:var(--hairline) solid hsl(var(--border));color:inherit;border-radius:var(--radius-md);padding:8px">' + opts + '</select>' +
            '<span class="mono" style="font-size:var(--text-xs);color:hsl(var(--muted-foreground))">VS</span>' +
            '<select data-hb style="flex:1;background:hsl(var(--surface-2));border:var(--hairline) solid hsl(var(--border));color:inherit;border-radius:var(--radius-md);padding:8px">' + opts + '</select></div>' +
            '<div data-elo class="mono" style="margin-top:10px;font-size:var(--text-xs);color:hsl(var(--muted-foreground))"></div>' +
            '<button class="chip acc" data-pred style="margin-top:10px;width:100%;justify-content:center">▶ 算预期胜率（Elo 逻辑公式，浏览器实跑）</button></div>' +
          '<div class="demo-card"><div class="t">Elo 预期得分</div><div data-bars style="margin-top:12px"></div>' +
            '<div class="demo-note" style="margin-top:12px">完整模型再经 Dixon-Coles 双泊松分解胜/平/负——引擎实测示例：西班牙 vs 德国 → <b>51.4% / 27.2% / 21.4%</b>（README 原始输出）</div></div>' +
        '</div>';
      const ha = $('[data-ha]', p0), hb = $('[data-hb]', p0); hb.selectedIndex = 7;
      function pred() {
        const a = ELO[ha.value], b = ELO[hb.value], d = a - b;
        const we = 1 / (1 + Math.pow(10, -d / 400));
        $('[data-elo]', p0).textContent = ha.value + ' ' + a + '  −  ' + hb.value + ' ' + b + '  =  Δ' + (d > 0 ? '+' : '') + d;
        $('[data-bars]', p0).innerHTML =
          '<div style="display:flex;height:34px;border-radius:var(--radius-md);overflow:hidden;border:var(--hairline) solid hsl(var(--border))">' +
          '<div style="width:' + (we * 100).toFixed(1) + '%;background:hsl(var(--accent)/.75);display:flex;align-items:center;justify-content:center;font-size:var(--text-xs)">' + (we * 100).toFixed(1) + '%</div>' +
          '<div style="flex:1;background:hsl(var(--surface-2));display:flex;align-items:center;justify-content:center;font-size:var(--text-xs)">' + ((1 - we) * 100).toFixed(1) + '%</div></div>' +
          '<div style="display:flex;justify-content:space-between;font-size:var(--text-xs);margin-top:6px" class="muted"><span>' + ha.value + ' 胜</span><span>' + hb.value + ' 胜</span></div>';
      }
      ha.addEventListener('change', pred); hb.addEventListener('change', pred);
      $('[data-pred]', p0).addEventListener('click', pred); pred();

      /* ② 回测面板 */
      const p1 = panes[1];
      const METS = [
        ['Accuracy（top-1）', 61.9, 33, false, '%', '越高越好'],
        ['RPS 排名概率得分', 0.1746, 0.245, true, '', '越低越好'],
        ['Brier 分数', 0.520, 0.667, true, '', '越低越好'],
        ['ECE 校准误差', 2.3, 5.0, true, '%', '阈值 <5%'],
      ];
      p1.innerHTML =
        '<div class="demo-card"><div class="t">763 场 walk-forward 回测 vs 均匀基线</div>' +
        METS.map(m => {
          const span = m[3] ? (m[2] + m[1]) : m[2];
          const wModel = (m[3] ? (m[2] - m[1]) / span : m[1] / m[2]) * 100;
          const wBase = (m[3] ? m[2] / span : m[2] / m[2]) * 100;
          return '<div style="margin:16px 0 4px"><div style="display:flex;justify-content:space-between;font-size:var(--text-xs)"><span>' + m[0] + '</span><span class="mono"><b style="color:hsl(var(--accent))">' + m[1] + m[4] + '</b> <span class="muted">vs 基线 ' + m[2] + m[4] + '</span></span></div>' +
            '<div style="height:9px;border-radius:var(--radius-full);background:hsl(var(--surface-2));margin-top:6px;overflow:hidden"><div data-w style="width:0;height:100%;background:hsl(var(--accent));border-radius:var(--radius-full);transition:width 1.1s cubic-bezier(.16,1,.3,1)" data-target="' + wModel.toFixed(1) + '"></div></div>' +
            '<div class="mono" style="font-size:var(--text-xs);color:hsl(var(--muted-foreground));margin-top:3px">walk-forward：只用过去预测未来，无数据穿越 · ' + m[5] + '</div></div>';
        }).join('') +
        '<div class="demo-note">模型预测 61.9% 的比赛结果正确且校准误差 2.3%——「说 70% 把握」的事，长期真发生约 70%：这是可解释、可验证，不是玄学</div></div>';
      requestAnimationFrame(() => setTimeout(() => $$('[data-w]', p1).forEach(x => x.style.width = x.dataset.target + '%'), 300));

      /* ③ 融合决策 */
      const p2 = panes[2];
      p2.innerHTML =
        '<div class="demo-grid">' +
          '<div class="demo-card"><div class="t">两路证据 · 你来配权</div>' +
            '<div style="margin-top:10px;font-size:var(--text-xs)">统计模型胜率 <span class="mono" data-sv>62%</span><input type="range" min="40" max="85" value="62" data-stat style="width:100%;margin-top:4px;accent-color:hsl(var(--accent))"></div>' +
            '<div style="margin-top:10px;font-size:var(--text-xs)">易学倾向 <select data-yi style="width:100%;background:hsl(var(--surface-2));border:var(--hairline) solid hsl(var(--border));color:inherit;border-radius:var(--radius-md);padding:8px;margin-top:4px"><option>无明显倾向</option><option>利主队（强）</option><option>利客队（强）</option></select></div>' +
            '<div style="margin-top:10px;font-size:var(--text-xs)">权重：统计 <span class="mono" data-wv>70</span>% ｜ 易学 <span class="mono">30</span>%<input type="range" min="50" max="90" value="70" data-wt style="width:100%;margin-top:4px;accent-color:hsl(var(--accent))"></div></div>' +
          '<div class="demo-card"><div class="t">融合输出 · 含冲突规则</div><div data-fout style="margin-top:12px;min-height:150px"></div>' +
            '<div class="demo-note">反向冲突即切观望——宁可不出手，不硬凑结论</div></div>' +
        '</div>';
      const st = $('[data-stat]', p2), yi = $('[data-yi]', p2), wt = $('[data-wt]', p2);
      function fuse() {
        $('[data-sv]', p2).textContent = st.value + '%'; $('[data-wv]', p2).textContent = wt.value;
        const s = +st.value, w = +wt.value / 100, yRaw = yi.value;
        let yProb = s; let conflict = false;
        if (yRaw === '利主队（强）') { yProb = Math.min(90, s + 22); if (s < 50) conflict = true; }
        if (yRaw === '利客队（强）') { yProb = Math.max(10, s - 22); if (s > 50) conflict = true; }
        const f = s * w + yProb * (1 - w);
        $('[data-fout]', p2).innerHTML = conflict
          ? '<div style="padding:14px;border:var(--hairline) solid hsl(var(--warn)/.5);border-radius:var(--radius-md);font-size:var(--text-sm);color:hsl(var(--warn))">⚠ 两路证据反向冲突（统计 ' + s + '% vs 易学倾向对侧）<br><b>决策：切观望 · 放弃本场</b><br><span class="muted" style="font-size:var(--text-xs)">融合值 ' + f.toFixed(1) + '% 被规则否决——规则优先于数字</span></div>'
          : '<div style="font-size:var(--text-sm);line-height:2">统计 ' + s + '% × ' + w.toFixed(2) + ' + 易学侧 ' + yProb + '% × ' + (1 - w).toFixed(2) + '<br><b style="font-size:22px;color:hsl(var(--accent))">→ 主队胜率 ' + f.toFixed(1) + '%</b><br><span class="muted">证据同向 · 正常输出，附 EV/Kelly 可选</span></div>';
      }
      [st, wt].forEach(x => x.addEventListener('input', fuse));
      yi.addEventListener('change', fuse); fuse();
    },
  },
};
const stage = document.getElementById('stage');
const run = () => { stage.innerHTML = ''; try { DEMOS['yisheng-engine'].mount(stage); } catch (e) { stage.innerHTML = '<p class="muted mono">Demo 未响应，请刷新重试。</p>'; } };
document.getElementById('resetBtn').addEventListener('click', run);
run();
addEventListener('scroll', () => { const p = document.getElementById('progress'); const d = document.documentElement; p.style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%'; }, { passive: true });
</script>
</body>
