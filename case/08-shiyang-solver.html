<script>
'use strict';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgUse(id, size) { return '<svg class="icon" width="' + (size || 20) + '" height="' + (size || 20) + '"><use href="#' + id + '"/></svg>'; }


function toast(){}
const DEMOS = {
  'shiyang-solver': {
    mount(stage) {
      stage.innerHTML =
        '<div class="demo-grid">' +
          '<div class="demo-card"><div class="t">约束条件</div>' +
            '<div class="demo-row"><label>每日预算 <b>¥<span data-v-b>60</span></b> <span class="muted" style="font-size:var(--text-xs)">（往下拖，砍到它不可行）</span></label><input type="range" min="15" max="150" value="60" data-r-b aria-label="每日预算"></div>' +
            '<div class="demo-row"><label>忌口（可多选）</label><div class="chips" data-g="a"><span class="chip" data-a="辣">辣</span><span class="chip" data-a="海鲜">海鲜</span><span class="chip" data-a="香菜">香菜</span></div></div>' +
            '<div class="demo-row"><label>目标</label><div class="chips" data-g="g"><span class="chip on">减脂</span><span class="chip">增肌</span><span class="chip">日常</span></div></div>' +
            '<button class="btn btn-primary" data-run style="width:100%;margin-top:12px;justify-content:center">开始求解</button>' +
          '</div>' +
          '<div class="demo-card"><div class="t">求解输出 <span data-badge></span></div><div data-out><p class="muted" style="font-size:var(--text-sm)">设定约束后点「开始求解」。</p></div></div>' +
        '</div>' +
        '<div class="demo-note">演示数据 · 真实求解器在食养工程内 · 448 测试 94% 覆盖 · __post_init__ 构造即校验「必须有循证来源」· 单餐求解实测上限 &lt;5s</div>';
      const PLANS = {
        opt: { badge: ['ok', 'OPTIMAL'], steps: ['约束传播中…', '目标优化中…', '营养校验中…'],
          meals: [['早餐', '燕麦鸡蛋杯 + 牛奶', '420 kcal · 蛋白 22g<br>¥9', '燕麦·鸡蛋·牛奶：《中国食物成分表》标准版 · SY-FOOD-017/041'], ['午餐', '香煎鸡胸糙米饭 + 时蔬', '610 kcal · 蛋白 45g<br>¥18', '鸡胸·糙米：食物成分表 · SY-FOOD-003/112'], ['晚餐', '番茄豆腐汤 + 杂粮馒头', '480 kcal · 蛋白 20g<br>¥12', '北豆腐：SY-FOOD-058 · 番茄 SY-FOOD-077']],
          checks: ['✓ 预算 ¥39 达标', '✓ 热量缺口 -400 kcal（减脂）', '✓ 蛋白 87g 达标'] },
        deg: { badge: ['warn', 'DEGRADED · L3 已软化'], steps: ['约束传播中…', 'L4 预算触顶', '回溯软化 L3 营养带…', '重解中…'],
          meals: [['早餐', '燕麦鸡蛋杯', '320 kcal · 蛋白 14g<br>¥6', '燕麦·鸡蛋：《中国食物成分表》· SY-FOOD-017'], ['午餐', '香煎鸡腿饭 + 时蔬', '560 kcal · 蛋白 34g<br>¥14', '鸡腿：SY-FOOD-009（替代鸡胸，成本 -22%）'], ['晚餐', '白菜豆腐汤 + 馒头', '410 kcal · 蛋白 15g<br>¥8', '北豆腐：SY-FOOD-058 · 白菜 SY-FOOD-081']],
          checks: ['✓ 预算 ¥28 达标', '△ 蛋白 68g（L3 软化 -15%）', '✓ L1 过敏 / L2 禁忌零降级'] },
        inf: { badge: ['bad', 'INFEASIBLE → 已回溯'], steps: ['约束传播中…', 'L4 不可行', '回溯软化 L3…', '压至最低保障线…'],
          meals: [['早餐', '燕麦 + 水煮蛋两个', '300 kcal · 蛋白 12g<br>¥5', '燕麦·鸡蛋：SY-FOOD-017'], ['午餐', '鸡腿饭', '520 kcal · 蛋白 26g<br>¥9', '鸡腿：SY-FOOD-009'], ['晚餐', '紫菜蛋花汤 + 馒头', '330 kcal · 蛋白 10g<br>¥4', '紫菜：SY-FOOD-096']],
          checks: ['✓ 预算 ¥18 压线', '✓ L1 安全约束零让步', '△ 营养目标让位生存线'] },
      };
      const VETO = { '辣': '✓ V 系已过滤辛辣候选', '海鲜': '✓ V07 海鲜类禁忌：否决 2 道候选', '香菜': '✓ 香菜候选已排除' };
      $$('.chips .chip', stage).forEach(c => c.addEventListener('click', () => {
        const g = c.parentElement.dataset.g;
        if (g !== 'a') { $$('.chip', c.parentElement).forEach(x => x.classList.remove('on')); c.classList.add('on'); }
        else c.classList.toggle('on');
      }));
      $('[data-r-b]', stage).addEventListener('input', e => { $('[data-v-b]', stage).textContent = e.target.value; });
      $('[data-run]', stage).addEventListener('click', ev => {
        ev.target.disabled = true;
        const budget = +$('[data-r-b]', stage).value;
        const plan = budget >= 39 ? PLANS.opt : budget >= 25 ? PLANS.deg : PLANS.inf;
        const out = $('[data-out]', stage);
        $('[data-badge]', stage).innerHTML = '';
        let i = 0;
        out.innerHTML = '<p class="demo-log" data-st></p>';
        const tick = () => {
          if (i < plan.steps.length) {
            out.querySelector('[data-st]').textContent = plan.steps[i];
            i++;
            setTimeout(tick, REDUCED ? 60 : 340);
            return;
          }
          $('[data-badge]', stage).innerHTML = ' <span class="verdict ' + plan.badge[0] + '">' + plan.badge[1] + '</span>';
          const avoided = $$('.chip.on', $('[data-g="a"]', stage)).map(c => VETO[c.dataset.a]).filter(Boolean);
          out.innerHTML =
            plan.meals.map((m, mi) => '<div class="meal-row" data-meal="' + mi + '" style="cursor:pointer" title="点开看循证来源"><span class="mm">' + m[0] + '</span><span class="mn">' + m[1] + '</span><span class="mv">' + m[2] + '</span></div><div class="meal-src" data-src="' + mi + '" style="display:none;font-family:var(--font-mono);font-size:var(--text-xs);color:hsl(var(--ok));padding:0 0 10px 44px;line-height:1.7">▸ 循证 · ' + m[3] + '</div>').join('') +
            '<p class="muted mono" style="font-size:var(--text-xs);margin-top:8px;letter-spacing:0.1em">点任意一道菜，看它的循证来源（__post_init__ 强制，空来源直接拒构造）</p>' +
            '<div class="demo-checks">' + plan.checks.concat(avoided).map(c => '<span class="' + (c[0] === '△' ? 'verdict warn' : 'ok') + '" style="font-size:var(--text-xs);font-family:var(--font-mono)">' + c + '</span>').join('') + '</div>' +
            '<p class="demo-log" style="margin-top:10px">求解耗时 1.8s（演示节奏）· 真实工程断言 &lt;5s</p>';
          $$('.meal-row', out).forEach(r => r.addEventListener('click', () => {
            const s = out.querySelector('[data-src="' + r.dataset.meal + '"]');
            s.style.display = s.style.display === 'none' ? 'block' : 'none';
          }));
          ev.target.disabled = false;
        };
        tick();
      });
    },
  },
};
const stage = document.getElementById('stage');
const run = () => { stage.innerHTML = ''; try { DEMOS['shiyang-solver'].mount(stage); } catch (e) { stage.innerHTML = '<p class="muted mono">Demo 未响应，请刷新重试。</p>'; } };
document.getElementById('resetBtn').addEventListener('click', run);
run();
/* 进度条 + aurora 静态降级 */
addEventListener('scroll', () => { const p = document.getElementById('progress'); const d = document.documentElement; p.style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%'; }, { passive: true });
</script>
</body>
