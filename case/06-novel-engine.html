<script>
'use strict';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgUse(id, size) { return '<svg class="icon" width="' + (size || 20) + '" height="' + (size || 20) + '"><use href="#' + id + '"/></svg>'; }


const DEMOS = {
  'novel-engine': {
    mount(stage) {
      stage.innerHTML =
        '<div class="chips" style="margin-bottom:14px" data-tabs><span class="chip on" data-t="0">① 单一真相源</span><span class="chip" data-t="1">② 执行包编译 · 短上下文</span><span class="chip" data-t="2">③ 审校拦截 · 现场可测</span></div>' +
        '<div data-pane="0"></div><div data-pane="1" style="display:none"></div><div data-pane="2" style="display:none"></div>';
      const panes = $$('[data-pane]', stage);
      $$('[data-tabs] .chip', stage).forEach(c => c.addEventListener('click', () => {
        $$('[data-tabs] .chip', stage).forEach(x => x.classList.remove('on'));
        c.classList.add('on');
        panes.forEach(p => p.style.display = 'none');
        panes[+c.dataset.t].style.display = '';
      }));

      /* ---------- Pane 0 单一真相源 ---------- */
      const p0 = panes[0];
      const SECRET_V1 = '她把母亲的手术费，偷偷换成了第一版手稿的打印费。';
      const SECRET_V2 = '母亲至今以为那笔钱是医院退回来的——而她已经把收据烧了。';
      p0.innerHTML =
        '<div class="demo-grid">' +
          '<div class="demo-card"><div class="t">真相源 · macro/characters.yaml</div>' +
            '<div style="margin-top:8px;font-size:var(--text-xs)">林晚 · <span class="mono" style="font-size:var(--text-xs);color:hsl(var(--muted-foreground))">CHAR.001</span></div>' +
            '<div style="margin-top:6px;padding:9px 11px;border:var(--hairline) solid hsl(var(--border));border-radius:var(--radius-md);font-size:var(--text-xs);background:hsl(var(--surface-2))"><span class="mono" style="font-size:var(--text-xs);color:hsl(var(--accent))">secret:</span> <span data-src>' + SECRET_V1 + '</span></div>' +
            '<button class="chip acc" data-edit style="margin-top:10px;width:100%;justify-content:center">✎ 修改真相源（只改这一处）</button></div>' +
          '<div class="demo-card"><div class="t">其余文件 · 全部是 ID 引用</div>' +
            '<div data-ref style="margin-top:8px;padding:9px 11px;border:var(--hairline) dashed hsl(var(--border));border-radius:var(--radius-md);font-size:var(--text-xs)">chapters/007.yaml → <span class="mono" style="color:hsl(var(--accent))">CHAR.001.secret</span><div class="muted" style="margin-top:3px">写作时看到的：「<span data-mir>' + SECRET_V1 + '</span>」</div></div>' +
            '<div data-ref style="margin-top:8px;padding:9px 11px;border:var(--hairline) dashed hsl(var(--border));border-radius:var(--radius-md);font-size:var(--text-xs)">evolution/insights.yaml → <span class="mono" style="color:hsl(var(--accent))">CHAR.001.secret</span><div class="muted" style="margin-top:3px">揭底核对清单：「<span data-mir>' + SECRET_V1 + '</span>」</div></div>' +
            '<div data-sync class="mono" style="margin-top:10px;font-size:var(--text-xs);color:hsl(var(--ok));opacity:0;transition:opacity .3s">✓ 引用 ×2 已同步——伏笔永远不会前后打架</div></div>' +
        '</div>' +
        '<div class="demo-note">单一真相源：人物/世界/伏笔/规则只在归属文件维护，其余位置只做 ID 引用（compile 期按需展开）——这是 2499 项测试守着的第一原则</div>';
      let flipped = false;
      $('[data-edit]', p0).addEventListener('click', () => {
        flipped = !flipped;
        $('[data-src]', p0).textContent = flipped ? SECRET_V2 : SECRET_V1;
        $$('[data-mir]', p0).forEach(x => x.textContent = flipped ? SECRET_V2 : SECRET_V1);
        $('[data-sync]', p0).style.opacity = 1;
      });

      /* ---------- Pane 1 执行包编译 ---------- */
      const p1 = panes[1];
      p1.innerHTML =
        '<div class="demo-grid">' +
          '<div class="demo-card"><div class="t">工程输入</div>' +
            '<div class="mono" style="font-size:var(--text-xs);line-height:2;margin-top:6px">' +
              'blueprint/007.yaml <span class="muted">content_structure · plot_lines</span><br>' +
              'macro/style_rulebook.yaml <span class="muted">种子规则库（只增不改）</span><br>' +
              'runtime/state.yaml <span class="muted">问题债 · 成长进度</span><br>' +
              'evolution/insights.yaml <span class="muted">作者品味批注</span></div>' +
            '<button class="chip acc" data-compile style="margin-top:12px;width:100%;justify-content:center">▶ 编译第 7 章执行包</button></div>' +
          '<div class="demo-card"><div class="t">执行包 · 只装本章要用的</div><div data-cv style="margin-top:8px;min-height:210px"></div></div>' +
        '</div>' +
        '<div class="demo-note">短上下文执行：生效规则带「代价/unknown 信息边界」全文注入，出场人物按名单抽卡（method/policy/channel），品味记忆 cap 6——幻觉和成本一起控</div>';
      const steps = [
        ['<b>结构卡</b> · 起承转合 + 主线/支线/事件/情绪/逻辑', '蓝图 content_structure 编译期注入，写作代理不自由发挥结构'],
        ['<b>生效规则 · 全文</b>', '只带本章激活的世界规则——含代价与 unknown 信息边界锁定清单'],
        ['<b>人物卡 ×3</b> · method / policy / channel', '按出场名单以 ID 抽取，招牌路数与 if-then 政策随身携带'],
        ['<b>压力面板</b> · 戏眼候选 / 上章钩子 / 到期债务 / 世界政策', '写作前四问——问题债台账逾期自动催收'],
        ['<b>品味记忆</b> · 作者批注 ×6（cap 6）', 'absorbed 状态批注按置信度降序注入，带「严禁复制」约束'],
      ];
      let busy = false;
      $('[data-compile]', p1).addEventListener('click', async () => {
        if (busy) return; busy = true;
        const cv = $('[data-cv]', p1); cv.innerHTML = '';
        for (const [body, why] of steps) {
          const d = document.createElement('div');
          d.innerHTML = '<div style="padding:8px 11px;border:var(--hairline) solid hsl(var(--border));border-radius:var(--radius-md);margin-bottom:7px;font-size:var(--text-xs)">' + body +
            '<div class="mono" style="font-size:var(--text-xs);margin-top:4px;color:hsl(var(--accent))">✓ ' + why + '</div></div>';
          cv.appendChild(d);
          await new Promise(r => setTimeout(r, 430));
        }
        const fin = document.createElement('div');
        fin.innerHTML = '<div class="mono" style="text-align:center;font-size:var(--text-xs);color:hsl(var(--ok));border:var(--hairline) dashed hsl(var(--ok));border-radius:var(--radius-sm);padding:6px">执行包就绪 · 生长式最小可写包（growth_basis 记录本章从哪条规则 × 哪个人物长出来）</div>';
        cv.appendChild(fin);
        busy = false;
      });

      /* ---------- Pane 2 审校拦截（真实规则现场跑） ---------- */
      const p2 = panes[2];
      const SAMPLE = '他不是运气好，而是把每一条退路都提前堵死了。台灯亮着,稿纸上写满批注——她数的不是字数，而是停顿。这份平静不是真相......而是一场排练。他说:"没事",然后转身走了。';
      p2.innerHTML =
        '<div class="demo-card"><div class="t">审校层 · 否定翻转句式 + 标点归一（与引擎同一套规则，浏览器实跑）</div>' +
          '<textarea data-src style="width:100%;min-height:96px;margin-top:8px;border:var(--hairline) solid hsl(var(--border));border-radius:var(--radius-md);background:hsl(var(--surface-2));color:hsl(var(--foreground));padding:10px;font-size:var(--text-xs);line-height:1.7;resize:vertical">' + SAMPLE + '</textarea>' +
          '<button class="chip acc" data-run style="margin-top:10px;width:100%;justify-content:center">▶ 跑审校</button>' +
          '<div data-out style="margin-top:10px"></div></div>' +
        '<div class="demo-note">廉价翻转（「不是 A，而是 B」）与半角标点在重写之前拦下——审校 metrics 带平台侧重（番茄/起点 rubric），供卷级进化使用</div>';
      const RULES = [
        { re: /(不是|并非)[^，。；！？]{1,16}，\s*(而是|反倒|反而)/g, label: '否定翻转 · 廉价转折', tone: 'var(--danger)' },
        { re: /[\u4e00-\u9fff],[\u4e00-\u9fff]/g, label: '半角逗号 · 应为，', tone: 'var(--warn)' },
        { re: /\.{3,}/g, label: '西式省略号 · 应为……', tone: 'var(--warn)' },
        { re: /[\u4e00-\u9fff]--|[\u4e00-\u9fff]"/g, label: '半角引号/连字符 · 归一化', tone: 'var(--warn)' },
      ];
      function review() {
        const txt = $('[data-src]', p2).value;
        const out = $('[data-out]', p2);
        let hits = [];
        RULES.forEach(r => { r.re.lastIndex = 0; let m; while ((m = r.re.exec(txt))) hits.push({ label: r.label, tone: r.tone, frag: m[0] }); });
        const flips = hits.filter(x => x.label.indexOf('否定') === 0).length;
        const punct = hits.length - flips;
        out.innerHTML = hits.length
          ? hits.map(x => '<div style="font-size:var(--text-xs);margin:5px 0;padding:7px 10px;border-radius:var(--radius-md);border:var(--hairline) solid hsl(' + x.tone + '/.45)"><span class="mono" style="font-size:var(--text-xs);color:hsl(' + x.tone + ')">' + x.label + '</span>　「' + esc(x.frag) + '」</div>').join('') +
            '<div class="mono" style="margin-top:8px;font-size:var(--text-xs);color:hsl(var(--danger))">判定：打回重写 · 句式 ' + flips + ' · 标点 ' + punct + '</div>'
          : '<div class="mono" style="font-size:var(--text-xs);color:hsl(var(--ok))">✓ 本段通过——无廉价翻转，标点归一</div>';
      }
      $('[data-run]', p2).addEventListener('click', review);
      review();
    },
  },
};
const stage = document.getElementById('stage');
const run = () => { stage.innerHTML = ''; try { DEMOS['novel-engine'].mount(stage); } catch (e) { stage.innerHTML = '<p class="muted mono">Demo 未响应，请刷新重试。</p>'; } };
document.getElementById('resetBtn').addEventListener('click', run);
run();
addEventListener('scroll', () => { const p = document.getElementById('progress'); const d = document.documentElement; p.style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%'; }, { passive: true });
</script>
</body>
