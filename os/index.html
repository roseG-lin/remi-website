<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Remi OS v2.5 — 一台装载大脑分区的复古未来电脑：作品、技能、经历、人格。AI 售前 / 解决方案工程师 Remi 的个人宇宙控制台。">
<title>Remi OS v2.5 · 个人宇宙控制台</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS · 冻结设计系统（源自 style-exploration 定稿）
   ============================================================ */
:root {
  /* 色板 · HSL 三元组 */
  --background:        210 60% 6%;
  --surface:           210 40% 10%;
  --surface-2:         210 38% 13%;
  --foreground:        210 20% 98%;
  --muted-foreground:  214 15% 65%;
  --accent:            199 89% 48%;
  --border:            215 20% 22%;
  --danger:            0 72% 51%;
  --ok:                152 60% 45%;
  --warn:              40 90% 55%;
  --term-green:        160 80% 55%;

  /* 玻璃 */
  --glass-fill:        rgba(255,255,255,0.06);
  --glass-top-edge:    rgba(255,255,255,0.12);
  --glass-hover-fill:  rgba(255,255,255,0.12);
  --scrim:             linear-gradient(180deg, rgba(2,12,26,0.35) 0%, rgba(2,12,26,0) 40%, rgba(2,12,26,0.55) 100%);

  /* 字体 */
  --font-display: 'Instrument Serif', 'Songti SC', 'SimSun', serif;
  --font-body:    'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono:    'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace;

  /* 字阶 */
  --text-h1: clamp(2.2rem, 5vw, 3.4rem);  --lh-h1: 1.05;
  --text-h2: 1.6rem;                       --lh-h2: 1.15;
  --text-body: 0.95rem;                    --lh-body: 1.7;
  --text-sm: 13px;
  --text-xs: 12px;
  --text-2xs: 10px;
  --text-caption: 0.8125rem;               --lh-caption: 1.5;  --tracking-caption: 0.08em;

  /* 间距 */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;

  /* 圆角 */
  --radius-lg: 8px; --radius-xl: 12px; --radius-2xl: 16px; --radius-full: 999px;

  /* 动效 · 窗口系统规范 3.4 */
  --dur-window-in:   180ms;  --ease-window-in:  cubic-bezier(0.2, 0.9, 0.3, 1.2);
  --dur-window-out:  140ms;  --ease-window-out: ease-in;
  --dur-minimize:    200ms;  --ease-minimize:   ease-in-out;
  --dur-bounce:      240ms;
  --dur-hover:       120ms;
  --dur-enter:       0.8s;
  --dur-type:        12ms;
  --dur-reduced:     80ms;

  /* 尺寸 */
  --titlebar-h: 44px;  --tb-btn: 28px;
  --dock-h: 60px;
  --win-min-w: 420px;  --win-min-h: 320px;

  /* 阴影 */
  --shadow-window: 0 24px 64px rgba(0,0,0,0.5);
  --shadow-menu:   0 16px 40px rgba(0,0,0,0.45);

  /* 层级 */
  --z-video: 0; --z-scrim: 1; --z-desktop: 2; --z-windows: 10; --z-dock: 60;
  --z-menu: 70; --z-toast: 80; --z-dialog: 90; --z-boot: 100; --z-matrix: 95; --z-shutdown: 110;
}

/* ============ 基础 ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; }
button, input { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
::selection { background: hsl(var(--accent)); color: hsl(var(--background)); }
:focus-visible { outline: 2px solid hsl(var(--accent)); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

.bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: var(--z-video); pointer-events: none; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: var(--z-scrim); pointer-events: none; }

.mono { font-family: var(--font-mono); }
.caption { font-size: var(--text-caption); line-height: var(--lh-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; }
.muted { color: hsl(var(--muted-foreground)); }
.accent { color: hsl(var(--accent)); }
.icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* 液态玻璃（逐字冻结） */
.liquid-glass {
  background: rgba(255,255,255,0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: none;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 8px 32px rgba(0,0,0,0.35);
  position: relative;
}
.liquid-glass::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
  background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
}
.lg-hidden-overflow { overflow: hidden; }

@keyframes fade-rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

/* ============ 开机序列 ============ */
#boot {
  position: fixed; inset: 0; z-index: var(--z-boot);
  background: hsl(var(--background));
  display: flex; align-items: center; justify-content: center;
  transition: opacity 600ms ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
.boot-box { width: min(560px, 88vw); font-family: var(--font-mono); font-size: var(--text-sm); }
.boot-lines { min-height: 10.5em; color: hsl(var(--muted-foreground)); white-space: pre-wrap; line-height: 1.9; }
.boot-lines .ok { color: hsl(var(--term-green)); }
.boot-lines .hl { color: hsl(var(--foreground)); }
.boot-bar { margin-top: var(--space-5); height: 6px; border-radius: var(--radius-full); background: rgba(255,255,255,0.08); overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 0%; background: hsl(var(--accent)); border-radius: inherit; transition: width 200ms linear; }
.boot-skip {
  position: fixed; right: var(--space-6); bottom: var(--space-6);
  font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.15em;
  color: hsl(var(--muted-foreground)); padding: 8px 14px; border-radius: var(--radius-lg);
  border: 1px solid hsl(var(--border));
}
.boot-skip:hover { color: hsl(var(--foreground)); background: var(--glass-fill); }

/* CRT 亮起闪光 */
.crt-flash { position: fixed; inset: 0; z-index: calc(var(--z-boot) - 1); background: #cfe9ff; opacity: 0; pointer-events: none; }
.crt-flash.on { animation: crt 420ms ease-out; }
@keyframes crt { 0% { opacity: 0.9; transform: scaleY(0.002); } 40% { opacity: 0.5; transform: scaleY(1); } 100% { opacity: 0; } }

/* ============ 桌面 ============ */
#desktop { position: fixed; inset: 0; z-index: var(--z-desktop); visibility: hidden; }
#desktop.ready { visibility: visible; }

.desk-icons {
  position: absolute; top: var(--space-8); left: var(--space-8);
  display: grid; grid-template-columns: repeat(2, 96px); gap: var(--space-6) var(--space-4);
}
.desk-icon {
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  padding: var(--space-2) 4px; border-radius: var(--radius-xl);
  opacity: 0; transform: translateY(14px) scale(0.92);
}
#desktop.ready .desk-icon { animation: icon-pop 480ms cubic-bezier(0.2,0.9,0.3,1.2) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes icon-pop { to { opacity: 1; transform: none; } }
.desk-icon .tile {
  width: 60px; height: 60px; border-radius: var(--radius-2xl);
  display: grid; place-items: center; color: hsl(var(--foreground));
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 6px 20px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.09);
  transition: transform var(--dur-hover) ease-out, background var(--dur-hover) ease-out;
}
.desk-icon:hover .tile { transform: translateY(-4px); background: var(--glass-hover-fill); }
.desk-icon.selected .tile { outline: 1.5px solid hsl(var(--accent)); outline-offset: 2px; }
.desk-icon .lbl {
  font-size: var(--text-xs); color: hsl(var(--foreground)); text-align: center; line-height: 1.35;
  text-shadow: 0 1px 6px rgba(0,0,0,0.8); max-width: 92px;
}
/* 桌面身份区 */
#deskHero {
  position: absolute; top: 14%; left: 50%; transform: translateX(-50%);
  text-align: center; pointer-events: none; z-index: 1;
}
#deskHero .hero-name {
  font-family: var(--font-display); font-style: italic;
  font-size: clamp(3.2rem, 7vw, 5.2rem); line-height: 1; letter-spacing: -1px;
  text-shadow: 0 4px 40px rgba(2,12,26,0.65);
}
#deskHero .hero-slogan {
  margin-top: var(--space-3); font-size: 1.05rem; color: hsl(var(--foreground) / 0.88);
  text-shadow: 0 2px 16px rgba(2,12,26,0.8);
}
#deskHero .hero-meta {
  margin-top: var(--space-3); font-family: var(--font-mono); font-size: var(--text-2xs);
  letter-spacing: 0.22em; text-transform: uppercase; color: hsl(var(--muted-foreground));
}
#desktop.ready #deskHero > * { animation: fade-rise var(--dur-enter) ease-out both; }
#desktop.ready #deskHero .hero-slogan { animation-delay: 150ms; }
#desktop.ready #deskHero .hero-meta { animation-delay: 300ms; }

/* 图标 hover 钩子 */
.desk-icon { position: relative; }
.desk-icon::after {
  content: attr(data-tip);
  position: absolute; left: 50%; top: -6px; z-index: 5;
  white-space: nowrap; padding: 5px 10px; border-radius: var(--radius-lg);
  background: hsl(var(--surface) / 0.92); border: 1px solid hsl(var(--border));
  font-family: var(--font-mono); font-size: var(--text-2xs); color: hsl(var(--foreground));
  opacity: 0; transform: translate(-50%, 4px); pointer-events: none;
  transition: opacity var(--dur-hover) ease-out, transform var(--dur-hover) ease-out;
}
.desk-icon:hover::after { opacity: 1; transform: translate(-50%, 0); }
body.hint-entry .desk-icon.is-entry::after { opacity: 1; transform: translate(-50%, 0); }

/* 简历.exe 霓虹呼吸 */
.desk-icon.is-entry .tile { outline: 1.5px solid hsl(var(--accent)); outline-offset: 3px; animation: entry-pulse 2.6s ease-in-out infinite; }
.desk-icon.is-entry .lbl { color: hsl(var(--accent)); }
@keyframes entry-pulse {
  50% { outline-color: hsl(var(--accent) / 0.25);
        box-shadow: 0 0 26px hsl(var(--accent) / 0.3), inset 0 1px 1px rgba(255,255,255,0.1); }
}
.qr-badge {
  position: absolute; top: -6px; right: -10px; padding: 2px 5px; border-radius: 6px;
  background: hsl(var(--accent)); color: hsl(var(--background));
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; font-weight: 500;
}
.desk-icon .tilewrap { position: relative; }
.desk-icon.hidden-app { display: none; }
.desk-icon.hidden-app.revealed { display: flex; }

/* 数字仪表盘 */
#dash {
  position: absolute; top: var(--space-8); right: var(--space-8);
  padding: var(--space-4) var(--space-5); border-radius: var(--radius-2xl);
  display: flex; gap: var(--space-6);
  opacity: 0; transition: opacity 800ms ease 400ms;
}
#desktop.ready #dash { opacity: 1; }
.dash-item { text-align: center; min-width: 64px; }
.dash-num { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; color: hsl(var(--foreground)); }
.dash-num small { font-size: 0.9rem; color: hsl(var(--accent)); }
.dash-lbl { font-size: var(--text-2xs); color: hsl(var(--muted-foreground)); letter-spacing: 0.06em; margin-top: 2px; }

/* ============ 窗口系统 ============ */
#windows { position: fixed; inset: 0; z-index: var(--z-windows); pointer-events: none; }
.window {
  position: absolute; pointer-events: auto;
  border-radius: var(--radius-2xl);
  display: flex; flex-direction: column;
  color: hsl(var(--foreground));
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), var(--shadow-window);
  overflow: hidden;
}
.window.blurred .titlebar { opacity: 0.66; filter: saturate(0.4); }
.window.blurred .win-body { opacity: 0.88; }
.window.opening { animation: win-in var(--dur-window-in) var(--ease-window-in) both; }
.window.closing { animation: win-out var(--dur-window-out) var(--ease-window-out) both; }
.window.minimizing { animation: win-min var(--dur-minimize) var(--ease-minimize) both; }
.window.restoring { animation: win-restore var(--dur-minimize) var(--ease-minimize) both; }
.window.bouncing { animation: win-bounce var(--dur-bounce) ease-out; }
@keyframes win-in  { from { opacity: 0; transform: scale(0.94) translateY(12px); } }
@keyframes win-out { to   { opacity: 0; transform: scale(0.94) translateY(12px); } }
@keyframes win-min { to   { opacity: 0; transform: scale(0.6) translateY(40vh); } }
@keyframes win-restore { from { opacity: 0; transform: scale(0.6) translateY(40vh); } }
@keyframes win-bounce { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
.window.maximized { border-radius: 0; }

.titlebar {
  height: var(--titlebar-h); flex: none;
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-3);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: grab; user-select: none; -webkit-user-select: none;
  touch-action: none;
}
.titlebar:active { cursor: grabbing; }
.tb-icon { width: 18px; height: 18px; display: grid; place-items: center; }
.tb-title { font-size: var(--text-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-controls { margin-left: auto; display: flex; gap: var(--space-2); flex: none; }
.tb-btn {
  width: var(--tb-btn); height: var(--tb-btn); border-radius: var(--radius-full);
  background: var(--glass-fill); display: grid; place-items: center;
  transition: background var(--dur-hover) ease-out;
}
.tb-btn:hover { background: var(--glass-hover-fill); }
.tb-close:hover { background: hsl(var(--danger)); }
.tb-min, .tb-max { display: grid; }
.window.maximized .tb-max svg { transform: scale(0.85); }

.win-body { flex: 1; overflow: auto; position: relative; overscroll-behavior: contain; background: linear-gradient(hsl(210 45% 8% / 0.55), hsl(210 45% 8% / 0.4)); }
.resize-handle {
  position: absolute; right: 0; bottom: 0; width: 20px; height: 20px;
  cursor: nwse-resize; touch-action: none; z-index: 3;
}
.resize-handle::after {
  content: ''; position: absolute; right: 5px; bottom: 5px; width: 10px; height: 10px;
  border-right: 2px solid rgba(255,255,255,0.35); border-bottom: 2px solid rgba(255,255,255,0.35);
  border-radius: 0 0 3px 0;
}

/* ============ Dock（任务栏替代） ============ */
#dock {
  position: fixed; left: 50%; bottom: var(--space-5); transform: translateX(-50%);
  z-index: var(--z-dock);
  border-radius: var(--radius-2xl); padding: 10px var(--space-3);
  display: flex; align-items: center; gap: var(--space-2);
  max-width: calc(100vw - 24px);
}
.dock-btn {
  position: relative; width: 44px; height: 44px; flex: none;
  border-radius: var(--radius-xl); background: rgba(255,255,255,0.04);
  display: grid; place-items: center; color: hsl(var(--foreground));
  transition: transform var(--dur-hover) ease-out, background var(--dur-hover) ease-out;
}
.dock-btn:hover { transform: scale(1.12); background: var(--glass-hover-fill); }
.dock-btn .dock-dot { position: absolute; bottom: 3px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: hsl(var(--accent)); }
.dock-btn.focused { background: rgba(255,255,255,0.10); }
.dock-sep { width: 1px; height: 28px; background: rgba(255,255,255,0.12); flex: none; margin: 0 2px; }
.dock-clock {
  font-family: var(--font-mono); font-size: var(--text-xs); color: hsl(var(--foreground));
  padding: 0 var(--space-2); white-space: nowrap; cursor: default; min-width: 74px; text-align: center;
}
.dock-clock small { display: block; font-size: 9px; color: hsl(var(--muted-foreground)); letter-spacing: 0.08em; }
#dockTrophy { display: none; }
#dockTrophy.show { display: grid; }
#dockWindows { display: flex; gap: var(--space-2); }

/* 开始菜单 */
#startMenu {
  position: fixed; left: 50%; bottom: calc(var(--dock-h) + var(--space-5) + 8px);
  transform: translateX(-50%) translateY(8px);
  z-index: var(--z-menu); width: 260px;
  border-radius: var(--radius-2xl); padding: var(--space-3);
  opacity: 0; pointer-events: none;
  transition: opacity 180ms ease-out, transform 180ms ease-out;
}
#startMenu.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.sm-item {
  display: flex; align-items: center; gap: var(--space-3); width: 100%;
  padding: 10px var(--space-3); border-radius: var(--radius-lg); font-size: var(--text-sm);
  transition: background var(--dur-hover) ease-out; text-align: left;
}
.sm-item:hover { background: var(--glass-hover-fill); }
.sm-item .icon { color: hsl(var(--muted-foreground)); }
.sm-sep { height: 1px; background: hsl(var(--border)); margin: var(--space-2) var(--space-3); }
.sm-item.danger { color: #ff9a8a; }

/* 成就墙弹窗 */
#achvWall {
  position: fixed; right: var(--space-5); bottom: calc(var(--dock-h) + var(--space-5) + 8px);
  z-index: var(--z-menu); width: 300px;
  border-radius: var(--radius-2xl); padding: var(--space-4);
  opacity: 0; pointer-events: none; transform: translateY(8px);
  transition: opacity 180ms ease-out, transform 180ms ease-out;
}
#achvWall.open { opacity: 1; pointer-events: auto; transform: none; }
.achv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-top: var(--space-3); }
.achv-cell {
  aspect-ratio: 1; border-radius: var(--radius-lg); background: rgba(255,255,255,0.05);
  display: grid; place-items: center; font-family: var(--font-mono); font-size: var(--text-xs);
  color: hsl(var(--muted-foreground)); border: 1px solid rgba(255,255,255,0.06);
}
.achv-cell.on { color: hsl(var(--accent)); border-color: hsl(var(--accent) / 0.5); background: hsl(var(--accent) / 0.08); }

/* Toast */
#toast {
  position: fixed; right: var(--space-5); bottom: calc(var(--dock-h) + var(--space-5) + 16px);
  z-index: var(--z-toast); max-width: 320px;
  border-radius: var(--radius-xl); padding: var(--space-3) var(--space-4);
  font-size: var(--text-sm); display: flex; gap: var(--space-2); align-items: center;
  opacity: 0; transform: translateY(10px); pointer-events: none;
  transition: opacity 240ms ease-out, transform 240ms ease-out;
}
#toast.show { opacity: 1; transform: none; }
#toast .icon { color: hsl(var(--accent)); flex: none; }

/* 拟物对话框（音效询问 / 错误边界） */
.modal-mask {
  position: fixed; inset: 0; z-index: var(--z-dialog);
  background: rgba(2,12,26,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: grid; place-items: center;
}
.modal {
  width: min(380px, calc(100vw - 32px)); border-radius: var(--radius-2xl);
  padding: var(--space-6); text-align: center;
}
.modal h3 { font-size: 1.3rem; margin-bottom: var(--space-2); }
.modal p { color: hsl(var(--muted-foreground)); font-size: var(--text-sm); margin-bottom: var(--space-5); }
.modal .row { display: flex; gap: var(--space-3); justify-content: center; }
.btn {
  padding: 10px 22px; border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: 500;
  transition: transform var(--dur-hover) ease-out, background var(--dur-hover) ease-out;
}
.btn:hover { transform: scale(1.03); }
.btn-primary { background: hsl(var(--accent)); color: hsl(var(--background)); }
.btn-ghost { background: var(--glass-fill); }

/* 关机 */
#shutdown {
  position: fixed; inset: 0; z-index: var(--z-shutdown); background: #000;
  display: none; align-items: center; justify-content: center;
}
#shutdown.on { display: flex; }
.shutdown-line { width: 0; height: 2px; background: #dfe9ff; box-shadow: 0 0 24px #9fc8ff; animation: sdline 1s ease-in-out both; }
@keyframes sdline { 0% { width: 0; height: 100vh; } 45% { width: 60vw; height: 2px; } 100% { width: 0; height: 2px; opacity: 0; } }

/* Matrix 代码雨 */
#matrixFx { position: fixed; inset: 0; z-index: var(--z-matrix); display: none; }
#matrixFx.on { display: block; }

/* ============ App 通用 ============ */
.app-pad { padding: var(--space-5) var(--space-6); }
.app-h { font-size: 1.25rem; margin-bottom: var(--space-1); }
.app-sub { color: hsl(var(--muted-foreground)); font-size: var(--text-sm); margin-bottom: var(--space-4); }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: var(--radius-full);
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: 0.04em;
  color: hsl(var(--muted-foreground));
}
.chip.acc { color: hsl(var(--accent)); border-color: hsl(var(--accent) / 0.4); background: hsl(var(--accent) / 0.08); }
.chip.ok  { color: hsl(var(--ok));  border-color: hsl(var(--ok) / 0.4); }
.chip.warn{ color: hsl(var(--warn));border-color: hsl(var(--warn) / 0.4); }

/* 文件管理器 */
.fm { display: flex; height: 100%; }
.fm-tree {
  width: 168px; flex: none; border-right: 1px solid rgba(255,255,255,0.07);
  padding: var(--space-4) var(--space-2); overflow: auto;
}
.fm-tree .grp { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: hsl(var(--muted-foreground)); padding: var(--space-2) var(--space-3) 4px; }
.fm-tree button {
  display: flex; width: 100%; text-align: left; gap: 8px; align-items: center;
  padding: 7px var(--space-3); border-radius: var(--radius-lg); font-size: var(--text-sm);
  color: hsl(var(--muted-foreground)); transition: all var(--dur-hover) ease-out;
}
.fm-tree button:hover { background: var(--glass-fill); color: hsl(var(--foreground)); }
.fm-tree button.on { background: hsl(var(--accent) / 0.12); color: hsl(var(--accent)); }
.fm-main { flex: 1; overflow: auto; padding: var(--space-5); }
.fm-bar { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); font-size: var(--text-sm); }
.fm-back { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-lg); background: var(--glass-fill); font-size: var(--text-sm); transition: background var(--dur-hover) ease-out; }
.fm-back:hover { background: var(--glass-hover-fill); }
.fm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: var(--space-3); }
.fm-item {
  border-radius: var(--radius-xl); padding: var(--space-4) var(--space-3);
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  text-align: center; cursor: pointer;
  transition: transform var(--dur-hover) ease-out, border-color var(--dur-hover) ease-out, background var(--dur-hover) ease-out;
}
.fm-item:hover { transform: translateY(-3px); border-color: hsl(var(--accent) / 0.5); background: rgba(255,255,255,0.05); }
.fm-item .icon { color: hsl(var(--accent)); }
.fm-item .nm { font-size: var(--text-sm); font-weight: 500; line-height: 1.4; }
.fm-detail { max-width: 560px; margin: 0 auto; }
.fm-hero {
  height: 136px; border-radius: var(--radius-xl); margin-bottom: var(--space-4);
  display: grid; place-items: center; position: relative; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
}
.fm-hero .icon { width: 56px; height: 56px; color: rgba(255,255,255,0.85); }
.fm-hero .wm { position: absolute; right: 10px; bottom: 6px; font-family: var(--font-mono); font-size: var(--text-2xs); color: rgba(255,255,255,0.5); letter-spacing: 0.1em; }
.fm-tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-3) 0 var(--space-5); }
.fm-desc { color: hsl(var(--muted-foreground)); font-size: var(--text-sm); line-height: 1.8; margin-bottom: var(--space-4); }
.fm-desc b { color: hsl(var(--foreground)); font-weight: 500; }
.fm-actions { display: flex; gap: var(--space-3); }

/* 任务管理器 */
.tm { display: flex; flex-direction: column; height: 100%; }
.tm-chart { flex: none; height: 96px; border-bottom: 1px solid rgba(255,255,255,0.07); position: relative; }
.tm-chart canvas { width: 100%; height: 100%; display: block; }
.tm-chart .lbl { position: absolute; top: 8px; left: 14px; font-family: var(--font-mono); font-size: var(--text-2xs); color: hsl(var(--muted-foreground)); letter-spacing: 0.1em; }
.tm-table { flex: 1; overflow: auto; }
.tm-row {
  display: grid; grid-template-columns: minmax(150px,1.6fr) 64px 72px 76px 72px;
  gap: var(--space-2); align-items: center;
  padding: 8px var(--space-4); font-size: var(--text-sm); cursor: default;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.tm-row:hover { background: rgba(255,255,255,0.04); }
.tm-row.head { position: sticky; top: 0; background: hsl(var(--surface) / 0.9); backdrop-filter: blur(8px); font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: 0.1em; color: hsl(var(--muted-foreground)); text-transform: uppercase; cursor: pointer; z-index: 2; }
.tm-row .cpu { font-family: var(--font-mono); color: hsl(var(--accent)); }
.tm-row .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tm-row .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-row.slacking .nm, .tm-row.slacking .cpu { color: hsl(var(--muted-foreground)); }
.tm-detail { border-top: 1px solid rgba(255,255,255,0.07); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: hsl(var(--muted-foreground)); background: rgba(255,255,255,0.02); }

/* 终端 */
.term { height: 100%; display: flex; flex-direction: column; background: hsl(210 50% 5%); font-family: var(--font-mono); font-size: 13px; }
.term-out { flex: 1; overflow: auto; padding: var(--space-4); line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
.term-out .p { color: hsl(var(--accent)); }
.term-out .g { color: hsl(var(--term-green)); }
.term-out .m { color: hsl(var(--muted-foreground)); }
.term-out .w { color: hsl(var(--warn)); }
.term-in { display: flex; align-items: center; gap: 8px; padding: 10px var(--space-4); border-top: 1px solid rgba(255,255,255,0.08); }
.term-in .p { color: hsl(var(--accent)); flex: none; }
.term-in input { flex: 1; background: none; border: none; outline: none; font: inherit; color: hsl(var(--term-green)); caret-color: hsl(var(--accent)); }
.term-chips { display: none; gap: 6px; padding: 6px var(--space-4); border-top: 1px solid rgba(255,255,255,0.06); overflow-x: auto; }
.term-chips .chip { flex: none; cursor: pointer; }

/* 关于我 */
.about-tabs { display: flex; gap: 4px; padding: var(--space-3) var(--space-4) 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.about-tabs button {
  padding: 8px 14px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  font-size: var(--text-sm); color: hsl(var(--muted-foreground));
  transition: all var(--dur-hover) ease-out;
}
.about-tabs button.on { color: hsl(var(--foreground)); background: rgba(255,255,255,0.06); }
.about-page { padding: var(--space-5) var(--space-6); }
.about-hero { display: flex; gap: var(--space-5); align-items: center; margin-bottom: var(--space-5); }
.avatar {
  width: 84px; height: 84px; border-radius: var(--radius-2xl); flex: none;
  display: grid; place-items: center; overflow: hidden;
  background: linear-gradient(135deg, hsl(var(--accent) / 0.35), hsl(260 60% 30% / 0.5));
  border: 1px solid rgba(255,255,255,0.12);
  font-family: var(--font-display); font-size: 2rem; color: hsl(var(--foreground));
}
.tl { position: relative; padding-left: 22px; }
.tl::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: hsl(var(--border)); }
.tl-item { position: relative; padding-bottom: var(--space-5); }
.tl-item::before { content: ''; position: absolute; left: -21px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--border)); }
.tl-item.now::before { background: hsl(var(--accent)); box-shadow: 0 0 12px hsl(var(--accent)); }
.tl-ver { font-family: var(--font-mono); font-size: var(--text-2xs); color: hsl(var(--accent)); letter-spacing: 0.1em; }
.tl-title { font-weight: 500; margin: 2px 0; }
.tl-desc { font-size: var(--text-sm); color: hsl(var(--muted-foreground)); line-height: 1.7; }
.album { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
.album .ph {
  aspect-ratio: 1; border-radius: var(--radius-lg); cursor: zoom-in;
  display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.08);
  font-family: var(--font-mono); font-size: var(--text-2xs); color: rgba(255,255,255,0.55);
  transition: transform var(--dur-hover) ease-out;
}
.album .ph:hover { transform: scale(1.03); }
#lightbox { position: fixed; inset: 0; z-index: var(--z-dialog); background: rgba(2,12,26,0.8); display: none; place-items: center; cursor: zoom-out; }
#lightbox.on { display: grid; }
#lightbox .ph-big { width: min(70vmin, 420px); aspect-ratio: 1; border-radius: var(--radius-2xl); display: grid; place-items: center; font-family: var(--font-mono); color: rgba(255,255,255,0.6); }

/* 简历 */
.resume-doc { max-width: 620px; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-8); font-size: var(--text-sm); }
.resume-doc .r-name { font-family: var(--font-display); font-size: 2rem; }
.resume-doc .r-intent { color: hsl(var(--accent)); font-size: var(--text-sm); margin: 4px 0 2px; }
.resume-doc .r-meta { color: hsl(var(--muted-foreground)); font-size: var(--text-xs); font-family: var(--font-mono); }
.resume-doc h4 {
  font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caption);
  text-transform: uppercase; color: hsl(var(--muted-foreground));
  margin: var(--space-6) 0 var(--space-3); padding-bottom: 6px; border-bottom: 1px solid hsl(var(--border));
}
.resume-doc ul { list-style: none; }
.resume-doc li { padding-left: 16px; position: relative; margin-bottom: 6px; line-height: 1.8; color: hsl(210 18% 88%); }
.resume-doc li::before { content: '▸'; position: absolute; left: 0; color: hsl(var(--accent)); }
.resume-doc li b, .resume-doc .hl { color: hsl(var(--foreground)); font-weight: 500; }
.r-job { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px; margin-bottom: var(--space-2); }
.r-job .co { font-weight: 600; }
.r-job .pd { font-family: var(--font-mono); font-size: var(--text-2xs); color: hsl(var(--muted-foreground)); }
.resume-foot { margin-top: var(--space-8); padding-top: var(--space-4); border-top: 1px dashed hsl(var(--border)); display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; justify-content: space-between; }
.resume-explore { color: hsl(var(--muted-foreground)); font-size: var(--text-sm); }
.resume-explore button { color: hsl(var(--accent)); font-size: var(--text-sm); }

/* 联系 */
.contact-card { max-width: 380px; margin: var(--space-6) auto; text-align: center; padding: var(--space-8) var(--space-6); }
.contact-card .avatar { margin: 0 auto var(--space-4); }
.copy-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: var(--space-5); padding: 10px 20px; border-radius: var(--radius-full); background: hsl(var(--accent)); color: hsl(var(--background)); font-weight: 500; font-size: var(--text-sm); transition: transform var(--dur-hover) ease-out; }
.copy-btn:hover { transform: scale(1.04); }
.socials { display: flex; justify-content: center; gap: var(--space-3); margin-top: var(--space-5); }
.socials button { padding: 8px 14px; border-radius: var(--radius-lg); background: var(--glass-fill); font-size: var(--text-xs); font-family: var(--font-mono); color: hsl(var(--muted-foreground)); transition: all var(--dur-hover) ease-out; }
.socials button:hover { color: hsl(var(--foreground)); background: var(--glass-hover-fill); transform: scale(1.06); }

/* 回收站 */
.recycle-zone { position: relative; height: 100%; overflow: hidden; padding: var(--space-5); }
.recycle-head { text-align: center; color: hsl(var(--muted-foreground)); font-size: var(--text-sm); margin-bottom: var(--space-2); }
.note {
  position: absolute; width: 148px; padding: var(--space-3); border-radius: 4px 4px 14px 4px;
  font-size: var(--text-xs); line-height: 1.6; color: hsl(225 30% 12%);
  box-shadow: 0 8px 20px rgba(0,0,0,0.35); cursor: grab; user-select: none; -webkit-user-select: none;
  touch-action: none; transition: box-shadow var(--dur-hover) ease-out;
}
.note:active { cursor: grabbing; box-shadow: 0 16px 32px rgba(0,0,0,0.5); }
.recycle-foot { position: absolute; bottom: var(--space-4); left: 0; right: 0; text-align: center; font-size: var(--text-2xs); font-family: var(--font-mono); color: hsl(var(--muted-foreground)); pointer-events: none; }

/* 证据墙 */
.ev-list { padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
.ev-item { border-radius: var(--radius-xl); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: var(--space-4); cursor: pointer; transition: border-color var(--dur-hover) ease-out; }
.ev-item:hover { border-color: hsl(var(--accent) / 0.4); }
.ev-claim { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); font-weight: 500; }
.ev-src { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px dashed hsl(var(--border)); font-family: var(--font-mono); font-size: var(--text-xs); color: hsl(var(--muted-foreground)); line-height: 1.8; display: none; }
.ev-item.open .ev-src { display: block; }
.badge { flex: none; font-family: var(--font-mono); font-size: var(--text-2xs); padding: 2px 8px; border-radius: var(--radius-full); letter-spacing: 0.06em; }
.badge.a { color: hsl(var(--ok)); border: 1px solid hsl(var(--ok) / 0.5); background: hsl(var(--ok) / 0.08); }
.badge.b { color: hsl(var(--warn)); border: 1px solid hsl(var(--warn) / 0.5); background: hsl(var(--warn) / 0.08); }

/* 学习进行时 */
.learn-list { padding: var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
.learn-card { border-radius: var(--radius-xl); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: var(--space-4) var(--space-5); }
.learn-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 2px var(--space-3); margin-bottom: var(--space-2); }
.learn-name { font-weight: 500; }
.learn-meta { font-family: var(--font-mono); font-size: var(--text-2xs); color: hsl(var(--muted-foreground)); }
.learn-bar { height: 6px; border-radius: var(--radius-full); background: rgba(255,255,255,0.08); overflow: hidden; margin-top: var(--space-3); }
.learn-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: hsl(var(--accent)); }
.learn-bar.ind i { width: 40%; background: linear-gradient(90deg, transparent, hsl(var(--accent)), transparent); animation: ind 1.6s ease-in-out infinite; }
@keyframes ind { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* Demo 沙盒 */
.sandbox { display: flex; flex-direction: column; height: 100%; }
.sb-bar { flex: none; display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); }
.sb-bar .hint { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-2xs); color: hsl(var(--muted-foreground)); letter-spacing: 0.04em; }
.sb-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-lg); background: var(--glass-fill); font-size: var(--text-sm); transition: background var(--dur-hover) ease-out; }
.sb-btn:hover { background: var(--glass-hover-fill); }
.sb-stage { flex: 1; overflow: auto; padding: var(--space-6); }
.rag-pipe { display: flex; flex-direction: column; gap: var(--space-3); max-width: 520px; margin: 0 auto; }
.rag-q { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); }
.rag-q input { flex: 1; height: 40px; padding: 0 14px; border-radius: var(--radius-lg); background: var(--glass-fill); border: 1px solid hsl(var(--border)); font-size: var(--text-sm); outline: none; }
.rag-q input:focus { border-color: hsl(var(--accent)); box-shadow: 0 0 0 2px hsl(var(--accent) / 0.4); }
.rag-q .btn-primary { border-radius: var(--radius-lg); }
.rag-node { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-xl); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); opacity: 0.38; transition: all 240ms ease-out; }
.rag-node.run { opacity: 1; border-color: hsl(var(--accent) / 0.6); box-shadow: 0 0 24px hsl(var(--accent) / 0.15); }
.rag-node.done { opacity: 1; border-color: hsl(var(--ok) / 0.4); }
.rag-node .st { font-family: var(--font-mono); font-size: var(--text-2xs); color: hsl(var(--muted-foreground)); width: 20px; flex: none; }
.rag-node.done .st { color: hsl(var(--ok)); }
.rag-node .bd { flex: 1; }
.rag-node .t { font-size: var(--text-sm); font-weight: 500; }
.rag-node .d { font-size: var(--text-xs); color: hsl(var(--muted-foreground)); }
.rag-node .n { font-family: var(--font-mono); font-size: var(--text-sm); color: hsl(var(--accent)); flex: none; }
.rag-result { margin-top: var(--space-4); padding: var(--space-4); border-radius: var(--radius-xl); border: 1px solid hsl(var(--ok) / 0.4); background: hsl(var(--ok) / 0.06); font-size: var(--text-sm); display: none; }
.rag-result.on { display: block; animation: fade-rise 400ms ease-out both; }

/* ============ Demo 通用排版 ============ */
.sb-stage > * { max-width: 980px; margin-left: auto; margin-right: auto; }
.demo-head { margin-bottom: var(--space-5); }
.demo-head h3 { font-size: 1.35rem; }
.demo-head p { color: hsl(var(--muted-foreground)); font-size: var(--text-sm); margin-top: 6px; max-width: 46em; }
.demo-grid { display: grid; grid-template-columns: 300px 1fr; gap: var(--space-5); align-items: start; }
.demo-card { border-radius: var(--radius-xl); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); padding: var(--space-4) var(--space-5); }
.demo-card > .t { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: var(--space-4); }
.demo-row { margin-bottom: var(--space-4); }
.demo-row:last-child { margin-bottom: 0; }
.demo-row label { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--text-sm); color: hsl(var(--muted-foreground)); margin-bottom: 8px; }
.demo-row label b { color: hsl(var(--foreground)); font-family: var(--font-mono); font-weight: 500; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.12); outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: hsl(var(--accent)); cursor: pointer; box-shadow: 0 0 10px hsl(var(--accent) / 0.5); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%; background: hsl(var(--accent)); cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips .chip { cursor: pointer; transition: all var(--dur-hover) ease-out; }
.chips .chip.on { color: hsl(var(--accent)); border-color: hsl(var(--accent) / 0.5); background: hsl(var(--accent) / 0.12); }
.demo-log { font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.9; color: hsl(var(--muted-foreground)); margin-top: var(--space-3); min-height: 1.9em; }
.demo-log .ok { color: hsl(var(--ok)); }
.demo-log .hl { color: hsl(var(--foreground)); }
.demo-kpis { display: flex; gap: var(--space-4); margin-top: var(--space-5); flex-wrap: wrap; }
.demo-kpi { flex: 1; min-width: 130px; border-radius: var(--radius-xl); background: hsl(var(--accent) / 0.07); border: 1px solid hsl(var(--accent) / 0.25); padding: var(--space-3) var(--space-4); }
.demo-kpi .v { font-family: var(--font-mono); font-size: 1.35rem; color: hsl(var(--accent)); }

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isMobile = () => window.innerWidth <= 768;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgUse(id, size) { return '<svg class="icon" width="' + (size || 20) + '" height="' + (size || 20) + '"><use href="#' + id + '"/></svg>'; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ============================================================
   音效 · Web Audio 程序化合成（默认静音）
   ============================================================ */
const SFX = {
  enabled: store('remios_sound') === 'on',
  ctx: null,
  ac() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); return this.ctx; },
  tone(freq, t0, dur, type, gain) {
    const ctx = this.ac(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, ctx.currentTime + t0);
    g.gain.linearRampToValueAtTime(gain || 0.06, ctx.currentTime + t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t0 + dur);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + dur + 0.05);
  },
  play(name) {
    if (!this.enabled) return;
    try {
      switch (name) {
        case 'boot':  [261.6, 329.6, 392.0, 523.3].forEach((f, i) => this.tone(f, i * 0.35, 1.6, 'triangle', 0.05)); break;
        case 'open':  this.tone(660, 0, 0.12, 'sine', 0.07); this.tone(880, 0.05, 0.1, 'sine', 0.05); break;
        case 'close': this.tone(440, 0, 0.08, 'sine', 0.06); this.tone(293, 0.04, 0.1, 'sine', 0.05); break;
        case 'click': this.tone(1200, 0, 0.03, 'square', 0.03); break;
        case 'enter': this.tone(880, 0, 0.06, 'square', 0.04); break;
        case 'achv':  [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.09, 0.3, 'triangle', 0.05)); break;
        case 'error': this.tone(110, 0, 0.25, 'sawtooth', 0.05); break;
      }
    } catch (e) { /* 音频不可用时静默 */ }
  },
  toggle() {
    this.enabled = !this.enabled;
    store('remios_sound', this.enabled ? 'on' : 'off');
    renderMuteIcon();
    if (this.enabled) this.play('click');
  },
};
function renderMuteIcon() { $('#dockMute').innerHTML = svgUse(SFX.enabled ? 'i-vol2' : 'i-volx'); }

/* ============================================================
   窗口管理器（蓝图第 3 章 · 工程心脏）
   ============================================================ */
const WM = {
  wins: new Map(),   // appId -> win record
  topZ: 10,
  seq: 0,
  focused: null,
  openedOnce: new Set(),

  open(appId, opts) {
    opts = opts || {};
    const app = APPS[appId];
    if (!app) return;
    // 单实例：已存在 → 恢复 + 聚焦 + 弹跳
    const exist = this.wins.get(appId);
    if (exist) {
      if (exist.minimized) this.restore(exist);
      this.focus(exist);
      if (!REDUCED) { exist.el.classList.remove('bouncing'); void exist.el.offsetWidth; exist.el.classList.add('bouncing'); }
      if (opts.onReady) opts.onReady(exist);
      return exist;
    }
    const id = 'win-' + (++this.seq);
    const w = Math.min(app.w, window.innerWidth - 16);
    const h = Math.min(app.h, window.innerHeight - 100);
    const x = opts.x != null ? opts.x : clamp(Math.round((window.innerWidth - w) / 2 + (this.seq % 5) * 28 - 56), 8, Math.max(8, window.innerWidth - w - 8));
    const y = opts.y != null ? opts.y : clamp(Math.round((window.innerHeight - h) / 2.6 + (this.seq % 4) * 20 - 30), 8, Math.max(8, window.innerHeight - h - 80));
    const winEl = el(
      '<section class="window liquid-glass opening" role="dialog" aria-modal="false" aria-label="' + esc(app.title) + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;">' +
        '<div class="titlebar">' +
          '<span class="tb-icon">' + svgUse(app.icon, 16) + '</span>' +
          '<span class="tb-title">' + esc(app.title) + '</span>' +
          '<div class="tb-controls">' +
            '<button class="tb-btn tb-min" aria-label="最小化">' + svgUse('i-min', 12) + '</button>' +
            '<button class="tb-btn tb-max" aria-label="最大化">' + svgUse('i-max', 12) + '</button>' +
            '<button class="tb-btn tb-close" aria-label="关闭">' + svgUse('i-x', 12) + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="win-body"></div>' +
        '<div class="resize-handle" aria-hidden="true"></div>' +
      '</section>');
    const rec = { id, appId, el: winEl, body: $('.win-body', winEl), x, y, w, h, z: ++this.topZ, minimized: false, isMaximized: false, prevRect: null };
    winEl.style.zIndex = rec.z;
    $('#windows').appendChild(winEl);
    this.wins.set(appId, rec);

    // 内容（懒渲染一次）
    try { app.render(rec.body, rec); } catch (err) { this.crash(rec, err); }

    // 事件
    const tb = $('.titlebar', winEl);
    tb.addEventListener('pointerdown', e => this.dragStart(e, rec));
    tb.addEventListener('dblclick', e => { if (!e.target.closest('.tb-btn')) this.toggleMax(rec); });
    $('.tb-close', winEl).addEventListener('click', () => { SFX.play('close'); this.close(rec); });
    $('.tb-min', winEl).addEventListener('click', () => { SFX.play('click'); this.minimize(rec); });
    $('.tb-max', winEl).addEventListener('click', () => { SFX.play('click'); this.toggleMax(rec); });
    $('.resize-handle', winEl).addEventListener('pointerdown', e => this.resizeStart(e, rec));
    winEl.addEventListener('pointerdown', () => this.focus(rec), true);
    winEl.addEventListener('animationend', () => winEl.classList.remove('opening', 'mobile-in', 'restoring', 'minimizing', 'bouncing'));
    // 移动端左右滑切换
    winEl.addEventListener('touchstart', e => { rec._tx = e.touches[0].clientX; }, { passive: true });
    winEl.addEventListener('touchend', e => {
      if (!isMobile() || rec._tx == null) return;
      const dx = e.changedTouches[0].clientX - rec._tx;
      if (Math.abs(dx) > 72) this.swipeApp(dx < 0 ? 1 : -1);
      rec._tx = null;
    }, { passive: true });

    if (isMobile()) winEl.classList.add('mobile-in');
    SFX.play('open');
    this.focus(rec);
    this.renderDock();
    this.trackOpen(appId);
    if (app.onOpen) app.onOpen(rec);
    if (opts.onReady) opts.onReady(rec);
    return rec;
  },

  trackOpen(appId) {
    const REGULAR = ['files', 'taskmgr', 'terminal', 'about', 'resume', 'contact', 'recycle'];
    if (REGULAR.includes(appId)) {
      this.openedOnce.add(appId);
      if (this.openedOnce.size >= REGULAR.length) Achv.unlock('A2');
    }
  },

  focus(rec) {
    if (this.focused === rec && !rec.minimized) { rec.el.style.zIndex = rec.z; return; }
    this.focused = rec;
    rec.z = ++this.topZ;
    rec.el.style.zIndex = rec.z;
    this.wins.forEach(w => w.el.classList.toggle('blurred', w !== rec && !w.minimized));
    rec.el.classList.remove('blurred');
    this.renderDock();
  },

  close(rec) {
    const done = () => { rec.el.remove(); this.wins.delete(rec.appId); this.renderDock(); this.afterClose(); };
    if (REDUCED) { done(); return; }
    rec.el.classList.add('closing');
    setTimeout(done, 140);
  },
  afterClose() {
    const visible = Array.from(this.wins.values()).filter(w => !w.minimized);
    this.focused = visible[visible.length - 1] || null;
    if (this.focused) this.focus(this.focused);
    if (this.wins.size === 0) toast('桌面很干净。但我知道你会再点开一个。', 'i-star');
    this.renderDock();
  },

  minimize(rec) {
    rec.minimized = true;
    const hide = () => { rec.el.style.display = 'none'; };
    if (REDUCED) { hide(); } else {
      rec.el.classList.add('minimizing');
      setTimeout(hide, 200);
    }
    this.afterCloseFocus();
    this.renderDock();
  },
  afterCloseFocus() {
    const visible = Array.from(this.wins.values()).filter(w => !w.minimized);
    this.focused = visible[visible.length - 1] || null;
    if (this.focused) this.focus(this.focused);
  },
  restore(rec) {
    rec.minimized = false;
    rec.el.style.display = 'flex';
    if (!REDUCED) { rec.el.classList.add('restoring'); }
    this.focus(rec);
  },

  toggleMax(rec) {
    if (isMobile()) return;
    const e = rec.el;
    if (!rec.isMaximized) {
      rec.prevRect = { x: rec.x, y: rec.y, w: rec.w, h: rec.h };
      rec.isMaximized = true;
      e.classList.add('maximized');
      e.style.left = '0px'; e.style.top = '0px';
      e.style.width = window.innerWidth + 'px';
      e.style.height = (window.innerHeight - 0) + 'px';
    } else {
      rec.isMaximized = false;
      e.classList.remove('maximized');
      const p = rec.prevRect;
      rec.x = p.x; rec.y = p.y; rec.w = p.w; rec.h = p.h;
      e.style.left = p.x + 'px'; e.style.top = p.y + 'px';
      e.style.width = p.w + 'px'; e.style.height = p.h + 'px';
    }
    this.focus(rec);
  },

  dragStart(e, rec) {
    if (isMobile() || rec.isMaximized || e.target.closest('.tb-btn')) return;
    const startX = e.clientX, startY = e.clientY;
    const ox = rec.x, oy = rec.y;
    let moved = false;
    const tb = e.currentTarget;
    tb.setPointerCapture(e.pointerId);
    const move = ev => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!moved && Math.hypot(dx, dy) < 3) return;   // 3px 阈值
      if (!moved) { moved = true; rec.el.style.transition = 'none'; rec.body.style.userSelect = 'none'; }
      rec.x = clamp(ox + dx, -rec.w + 80, window.innerWidth - 40);
      rec.y = clamp(oy + dy, 0, window.innerHeight - 48);
      rec.el.style.left = rec.x + 'px';
      rec.el.style.top = rec.y + 'px';
    };
    const up = () => {
      tb.removeEventListener('pointermove', move);
      tb.removeEventListener('pointerup', up);
      rec.el.style.transition = '';
      rec.body.style.userSelect = '';
    };
    tb.addEventListener('pointermove', move);
    tb.addEventListener('pointerup', up);
  },

  resizeStart(e, rec) {
    if (isMobile() || rec.isMaximized) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const ow = rec.w, oh = rec.h;
    const handle = e.currentTarget;
    handle.setPointerCapture(e.pointerId);
    const move = ev => {
      rec.w = clamp(ow + ev.clientX - startX, 420, window.innerWidth - rec.x);
      rec.h = clamp(oh + ev.clientY - startY, 320, window.innerHeight - rec.y);
      rec.el.style.width = rec.w + 'px';
      rec.el.style.height = rec.h + 'px';
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  },

  swipeApp(dir) {
    const list = Array.from(this.wins.values()).filter(w => !w.minimized);
    if (list.length < 2 || !this.focused) return;
    const i = list.indexOf(this.focused);
    const next = list[(i + dir + list.length) % list.length];
    this.focus(next);
  },

  crash(rec, err) {
    rec.body.innerHTML = '';
    SFX.play('error');
    const m = el('<div class="modal-mask"><div class="modal liquid-glass"><h3>程序未响应</h3><p>' + esc(rec.appId) + '.exe 停止了工作。这台电脑对此表示遗憾。<br><span class="mono" style="font-size:11px">' + esc(String(err).slice(0, 120)) + '</span></p><div class="row"><button class="btn btn-primary">好</button></div></div></div>');
    $('button', m).addEventListener('click', () => m.remove());
    document.body.appendChild(m);
  },

  renderDock() {
    const dw = $('#dockWindows'); const tw = $('#tabWindows');
    dw.innerHTML = ''; tw.innerHTML = '';
    this.wins.forEach(rec => {
      const app = APPS[rec.appId];
      const b = el('<button class="dock-btn' + (this.focused === rec && !rec.minimized ? ' focused' : '') + '" aria-label="' + esc(app.title) + '" title="' + esc(app.title) + '">' + svgUse(app.icon, 20) + '<i class="dock-dot"></i></button>');
      b.addEventListener('click', () => {
        SFX.play('click');
        if (rec.minimized) this.restore(rec);
        else if (this.focused === rec) this.minimize(rec);
        else this.focus(rec);
      });
      dw.appendChild(b);
      const b2 = b.cloneNode(true);
      b2.addEventListener('click', () => { SFX.play('click'); if (rec.minimized) this.restore(rec); else this.focus(rec); });
      tw.appendChild(b2);
    });
  },
};

APPS.taskmgr = {
  title: '任务管理器 · 技能进程', icon: 'i-gauge', w: 740, h: 540,
  render(body, rec) {
    body.innerHTML =
      '<div class="tm">' +
        '<div class="tm-chart"><span class="lbl">CPU HISTORY ·&nbsp;<span data-focus-name>' + esc(CONTENT.skills[0].name) + '.exe</span></span><canvas></canvas></div>' +
        '<div class="tm-table"><div class="tm-row head" role="row">' +
          '<span data-k="name">名称</span><span data-k="user">用户</span><span data-k="cpu">CPU %</span><span class="c-mem" data-k="mem">内存</span><span data-k="status">状态</span>' +
        '</div><div data-rows></div></div>' +
        '<div class="tm-detail" data-detail hidden></div>' +
      '</div>';
    const rowsEl = $('[data-rows]', body);
    const canvas = $('canvas', body);
    const detailEl = $('[data-detail]', body);
    let sortKey = 'cpu', sortDir = -1, focusIdx = 0, timer = null;
    const hist = Array.from({ length: 60 }, () => CONTENT.skills[0].cpu);

    const paint = () => {
      const rows = CONTENT.skills.slice().sort((a, b) => {
        const va = a[sortKey], vb = b[sortKey];
        return (typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'zh')) * sortDir;
      });
      rowsEl.innerHTML = rows.map((s) => {
        const idx = CONTENT.skills.indexOf(s);
        const live = rec['cpu' + idx] != null ? rec['cpu' + idx] : s.cpu;
        return '<div class="tm-row' + (s.slack ? ' slacking' : '') + '" data-i="' + idx + '">' +
          '<span class="nm">' + svgUse(s.slack ? 'i-clock' : 'i-zap', 14) + '<span>' + esc(s.name) + (s.slack ? '' : '.exe') + '</span></span>' +
          '<span class="chip' + (s.user === 'dev' ? ' acc' : s.user === 'both' ? ' warn' : '') + '">' + s.user + '</span>' +
          '<span class="cpu">' + live.toFixed(1) + '</span>' +
          '<span class="c-mem muted">' + s.mem + '</span>' +
          '<span class="' + (s.status === '运行中' ? 'accent' : 'muted') + '" style="font-size:12px">' + s.status + '</span>' +
        '</div>';
      }).join('');
      $$('.tm-row[data-i]', rowsEl).forEach(r => {
        r.addEventListener('mouseenter', () => { focusIdx = +r.dataset.i; $('[data-focus-name]', body).textContent = CONTENT.skills[focusIdx].name + '.exe'; });
        r.addEventListener('dblclick', () => {
          const s = CONTENT.skills[+r.dataset.i];
          if (s.slack) {
            Achv.unlock('A5');
            const m = el('<div class="modal-mask"><div class="modal liquid-glass"><h3>摸鱼.exe 无响应</h3><p>它只是在休息。<br>等待不会有结果，关闭也不会。</p><div class="row"><button class="btn btn-ghost">随缘</button></div></div></div>');
            $('button', m).addEventListener('click', () => m.remove());
            document.body.appendChild(m);
            return;
          }
          detailEl.hidden = false;
          detailEl.innerHTML = '<b>' + esc(s.name) + '</b> — ' + esc(s.note);
        });
      });
    };
    $$('.tm-row.head span', body).forEach(h => h.addEventListener('click', () => {
      sortKey = h.dataset.k; sortDir *= -1; SFX.play('click'); paint();
    }));

    const draw = () => {
      const dpr = window.devicePixelRatio || 1;
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      if (!cw) return;
      canvas.width = cw * dpr; canvas.height = ch * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, cw, ch);
      const base = CONTENT.skills[focusIdx].cpu;
      hist.push(clamp(base + Math.sin(Date.now() / 900) * 1.8 + (Math.random() - 0.5) * 2.4, 0, 100));
      hist.shift();
      ctx.beginPath();
      hist.forEach((v, i) => {
        const x = (i / (hist.length - 1)) * cw;
        const y = ch - 8 - (v / 100) * (ch - 24);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent');
      ctx.strokeStyle = 'hsl(' + accent + ')';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.lineTo(cw, ch); ctx.lineTo(0, ch); ctx.closePath();
      ctx.fillStyle = 'hsl(' + accent + ' / 0.08)';
      ctx.fill();
    };
    paint();
    timer = setInterval(() => {
      if (rec.minimized || !document.body.contains(rec.el)) { clearInterval(timer); return; }
      CONTENT.skills.forEach((s, i) => {
        rec['cpu' + i] = s.slack ? 0 : clamp(s.cpu + Math.sin(Date.now() / 900 + i) * 3, 0, 100);
      });
      $$('.tm-row[data-i] .cpu', rowsEl).forEach((cEl, i2) => {
        const row = cEl.closest('.tm-row');
        cEl.textContent = rec['cpu' + row.dataset.i].toFixed(1);
      });
      draw();
    }, 800);
    draw();
  },
};

      matrix() { Achv.unlock('A6'); matrixRain(3000); print('<span class="g">Wake up, Remi.</span>'); },
      clear() { out.innerHTML = ''; },
    };
    CMDS['sudo unlock'] = () => {
      Achv.unlock('A6');
      print('<span class="w">[sudo] 权限提升…… 隐藏分区已挂载。</span>');
      revealHiddenApp();
    };

    const exec = raw => {
      const cmd = raw.trim();
      if (!cmd) return;
      print('<span class="p">remi@universe:~$</span> ' + esc(cmd));
      rec.history.push(cmd); hIdx = rec.history.length;
      SFX.play('enter');
      const fn = CMDS[cmd.toLowerCase()];
      if (fn) {
        fn();
        rec.cmdSet.add(cmd.toLowerCase().split(' ')[0]);
        if (rec.cmdSet.size >= 5) Achv.unlock('A3');
      } else if (/^open\s+\d+$/.test(cmd.toLowerCase())) {
        const n = +cmd.split(/\s+/)[1];
        const p = CONTENT.projects[n - 1];
        if (p) {
          print('<span class="g">打开 ' + esc(p.name) + ' …</span>');
          WM.open('files', { onReady: r => r.openProject && r.openProject(p.id) });
          rec.cmdSet.add('open');
          if (rec.cmdSet.size >= 5) Achv.unlock('A3');
        } else print('<span class="w">没有第 ' + n + ' 号作品。projects 查看列表。</span>');
      } else {
        print('<span class="m">' + esc(cmd) + ': command not found —— 但我欣赏你的探索精神。</span>');
      }
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { exec(input.value); input.value = ''; }
      else if (e.key === 'ArrowUp')   { e.preventDefault(); if (hIdx > 0) input.value = rec.history[--hIdx] || ''; }
      else if (e.key === 'ArrowDown') { e.preventDefault(); if (hIdx < rec.history.length) input.value = rec.history[++hIdx] || ''; }
    });
    $$('.term-chips .chip', body).forEach(c => c.addEventListener('click', () => { exec(c.dataset.cmd); input.focus(); }));
    rec.body.addEventListener('pointerdown', () => setTimeout(() => input.focus(), 0));
  },
};

/* ============================================================
   Matrix 代码雨
   ============================================================ */
function matrixRain(ms) {
  const cv = $('#matrixFx');
  cv.classList.add('on');
  const ctx = cv.getContext('2d');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const cols = Math.floor(cv.width / 16);
  const drops = Array.from({ length: cols }, () => Math.random() * -40);
  const chars = 'アイウエオ01玲珑REMI';
  const t0 = Date.now();
  const draw = () => {
    if (Date.now() - t0 > ms || REDUCED) { cv.classList.remove('on'); return; }
    ctx.fillStyle = 'rgba(3,10,18,0.12)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = '14px JetBrains Mono, monospace';
    drops.forEach((y, i) => {
      ctx.fillStyle = Math.random() > 0.96 ? '#bfefff' : '#0DA2E7';
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16);
      drops[i] = y * 16 > cv.height && Math.random() > 0.98 ? 0 : y + 1;
    });
    requestAnimationFrame(draw);
  };
  draw();
}

  const d = $('#dash');
  d.innerHTML = CONTENT.statistics.map((s, i) =>
    '<div class="dash-item"><div class="dash-num"><span data-n="' + s.n + '" data-i="' + i + '">0</span><small>' + s.suffix + '</small></div><div class="dash-lbl">' + esc(s.label) + '</div></div>').join('');
  $$('.dash-num span', d).forEach(sp => {
    const target = +sp.dataset.n;
    if (REDUCED) { sp.textContent = target; return; }
    const t0 = performance.now(), dur = 1400;
    const tick = now => {
      const p = clamp((now - t0) / dur, 0, 1);
      sp.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ============================================================
   时钟
   ============================================================ */
function startClock() {
  const c = $('#dockClock');
  const tick = () => {
    const d = new Date();
    c.innerHTML = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
      '<small>' + (d.getMonth() + 1) + '/' + d.getDate() + ' 周' + '日一二三四五六'[d.getDay()] + '</small>';
  };
  c.title = '时间在走，版本在涨。';
  tick(); setInterval(tick, 10000);
}

/* uptime · 本次会话运行时间 */
const bootTime = Date.now();
setInterval(() => {
  const s = Math.floor((Date.now() - bootTime) / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  const up = $('#uptime');
  if (up) up.textContent = 'UPTIME ' + h + ':' + m + ':' + ss;
}, 1000);

/* ============================================================
   开机序列（5 种分级 · 蓝图 8.2）
   ============================================================ */
const BIOS_LINES = [
  ['REMI BIOS v2.5', ''],
  ['MEMORY CHECK ............ 65536K ', 'OK'],
  ['CREATIVITY MODULE ....... ', 'LOADED'],
  ['CAFFEINE LEVEL .......... ', '74%'],
  ['MOUNTING PERSONALITY .... ', 'OK'],
  ['BOOTING REMI OS ......... ', ''],
];
let bootSkipped = false;
function boot(isReboot) {
  const bootEl = $('#boot');
  const lines = $('#bootLines');
  const bar = $('#bootBar');
  const skipBtn = $('#bootSkip');
  bootEl.classList.remove('gone');
  lines.innerHTML = ''; bar.style.width = '0%';
  bootSkipped = false;

  // 访次计数
  let visits = +(store('remios_visits') || 0);
  if (!isReboot) { visits += 1; store('remios_visits', String(visits)); }

  // 分级
  const directResume = location.hash === '#resume';
  let mode = 'full';
  if (REDUCED) mode = 'skip';
  else if (directResume) mode = 'fast';        // 1.5s
  else if (visits > 1 || isReboot) mode = 'return'; // 2s
  skipBtn.style.display = mode === 'full' ? '' : 'none';

  const finishBoot = () => {
    if (!REDUCED) { const f = $('#crtFlash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
    bootEl.classList.add('gone');
    $('#desktop').classList.add('ready');
    renderDash();
    if (mode === 'full' && !bootSkipped) Achv.unlock('A1');
    if (directResume) {
      WM.open('resume', { onReady: r => { if (!isMobile()) WM.toggleMax(r); } });
    } else if (visits >= 3 && !Achv.unlocked.has('A8')) {
      Achv.unlock('A8');
      setTimeout(() => { toast('又见面了。这次我不装了——直接给你开个窗口', 'i-star'); WM.open('about'); }, 900);
    }
    // 首访：简历入口提示 6s
    if (visits === 1 && !directResume) {
      document.body.classList.add('hint-entry');
      setTimeout(() => document.body.classList.remove('hint-entry'), 6000);
    }
    maybeAskSound();
  };

  if (mode === 'skip') { finishBoot(); return; }

  const perLine = mode === 'full' ? 380 : mode === 'return' ? 260 : 170;
  let i = 0;
  const typeLine = () => {
    if (bootSkipped) return;
    if (i >= BIOS_LINES.length) {
      bar.style.width = '100%';
      if (mode === 'full') SFX.play('boot');
      setTimeout(finishBoot, mode === 'full' ? 900 : 350);
      return;
    }
    const [text, mark] = BIOS_LINES[i];
    const div = el('<div></div>');
    lines.appendChild(div);
    let c = 0;
    const tick = () => {
      if (bootSkipped) return;
      c = Math.min(text.length, c + 3);
      div.innerHTML = esc(text.slice(0, c)) + (mark ? ' <span class="ok">' + mark + '</span>' : '');
      bar.style.width = Math.round(((i + c / text.length) / BIOS_LINES.length) * 100) + '%';
      if (c < text.length) setTimeout(tick, 24);
      else { i++; setTimeout(typeLine, perLine * 0.4); }
    };
    tick();
  };
  typeLine();

  skipBtn.onclick = () => {
    bootSkipped = true;
    finishBoot();
  };
}

/* 音效询问（开机后一次） */
function maybeAskSound() {
  if (store('remios_sound')) { renderMuteIcon(); return; }
  const m = el(
    '<div class="modal-mask"><div class="modal liquid-glass">' +
      '<h3>这台电脑会说话。</h3><p>开启 8-bit 音效？（随时可以点 Dock 上的喇叭反悔）</p>' +
      '<div class="row"><button class="btn btn-primary" data-yes>开启音效</button><button class="btn btn-ghost" data-no>保持安静</button></div>' +
    '</div></div>');
  $('[data-yes]', m).addEventListener('click', () => { store('remios_sound', 'on'); SFX.enabled = true; renderMuteIcon(); SFX.play('open'); m.remove(); });
  $('[data-no]', m).addEventListener('click', () => { store('remios_sound', 'off'); SFX.enabled = false; renderMuteIcon(); m.remove(); });
  document.body.appendChild(m);
}

/* ============================================================
   F2 窗口切换器
   ============================================================ */
const Switcher = {
  open: false, idx: 0, list: [],
  show() {
    this.list = Array.from(WM.wins.values());
    if (!this.list.length) return;
    this.open = true;
    const cur = this.list.indexOf(WM.focused);
    this.idx = cur >= 0 ? (cur + 1) % this.list.length : 0;
    this.paint();
    $('#switcher').classList.add('on');
  },
  paint() {
    $('#switcherPanel').innerHTML = this.list.map((w, i) => {
      const app = APPS[w.appId];
      return '<div class="sw-item' + (i === this.idx ? ' on' : '') + '">' + svgUse(app.icon, 22) + '<div class="nm">' + esc(app.title) + '</div></div>';
    }).join('');
  },
  cycle(dir) { this.idx = (this.idx + dir + this.list.length) % this.list.length; SFX.play('click'); this.paint(); },
  commit() {
    const w = this.list[this.idx];
    this.close();
    if (w) { if (w.minimized) WM.restore(w); WM.focus(w); SFX.play('open'); }
  },
  close() { this.open = false; $('#switcher').classList.remove('on'); },
};

/* ============================================================
   全局事件
   ============================================================ */
function bindGlobal() {
  $('#dockStart').addEventListener('click', () => toggleStart());
  $('#tabStart').addEventListener('click', () => toggleStart());
  $('#dockMute').addEventListener('click', () => SFX.toggle());
  $('#dockTrophy').addEventListener('click', () => { renderAchvWall(); $('#achvWall').classList.toggle('open'); });
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#startMenu') && !e.target.closest('#dockStart') && !e.target.closest('#tabStart')) toggleStart(false);
    if (!e.target.closest('#achvWall') && !e.target.closest('#dockTrophy')) $('#achvWall').classList.remove('open');
    if (!e.target.closest('.window') && !e.target.closest('#dock') && !e.target.closest('#tabbar')) {
      $$('.desk-icon').forEach(x => x.classList.remove('selected'));
    }
  });
  $('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('on'));
  document.addEventListener('keydown', e => {
    if (e.key === 'F2') { e.preventDefault(); Switcher.open ? Switcher.cycle(1) : Switcher.show(); return; }
    if (Switcher.open) {
      e.preventDefault();
      if (e.key === 'ArrowRight') Switcher.cycle(1);
      else if (e.key === 'ArrowLeft') Switcher.cycle(-1);
      else if (e.key === 'Enter') Switcher.commit();
      else if (e.key === 'Escape') Switcher.close();
      return;
    }
    if (e.key === 'Escape') {
      if ($('#lightbox').classList.contains('on')) { $('#lightbox').classList.remove('on'); return; }
      if ($('#startMenu').classList.contains('open')) { toggleStart(false); return; }
      if (WM.focused && !WM.focused.minimized) WM.close(WM.focused);
    }
  });
  $('#switcher').addEventListener('pointerdown', e => { if (e.target.id === 'switcher') Switcher.close(); });
  window.addEventListener('resize', () => {
    // 窗口钳制回视口
    WM.wins.forEach(w => {
      if (w.isMaximized) { w.el.style.width = window.innerWidth + 'px'; w.el.style.height = window.innerHeight + 'px'; return; }
      w.x = clamp(w.x, -w.w + 80, window.innerWidth - 40);
      w.y = clamp(w.y, 0, window.innerHeight - 48);
      w.el.style.left = w.x + 'px'; w.el.style.top = w.y + 'px';
    });
  });
}

/* ============================================================
   启动
   ============================================================ */
renderDesktop();
renderStartMenu();
renderMuteIcon();
if (Achv.unlocked.size > 0) $('#dockTrophy').classList.add('show');
if (Achv.unlocked.size >= ACHV_DEF.length || store('remios_hidden') === '1') revealHiddenApp();
bindGlobal();
startClock();
boot(false);
</script>
